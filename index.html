<script>

async function loadMenus(){

let data =
await fetch(
"https://script.google.com/macros/s/AKfycbwB6rawevysWtH9nvVI06ddHVDqNBn8KSLvRHd8kHUhGbHpPpUeuqlBoJCnuAS9sJlQ/exec"
)
.then(r=>r.json());

let html="";

data.slice(1)
.forEach(x=>{

if(x[1]){

html +=
`
<button>

${x[0]}

</button>
`;

}

});

document
.getElementById("menu")
.innerHTML =
html;

}

loadMenus();

</script>
