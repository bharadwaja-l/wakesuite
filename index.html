<!DOCTYPE html>
<html>

<head>
<title>WakeSuite</title>

<style>

body{
font-family:Arial;
padding:30px;
}

button{
display:block;
margin:10px 0;
padding:12px;
width:220px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>WakeSuite</h1>

<h3>Modules</h3>

<div id="menu">
Loading...
</div>

<script>

async function loadMenus(){

try{

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbzUMoC3QQAjUAQHC4kSKWsduPq4wU6O0ykdW--U-zONYDqDhM0hvwHpIWxAMC6PL-1x/exec"
);

let data =
await response.json();

let html = "";

data.slice(1).forEach(row=>{

if(row[1]){

html +=
`<button>${row[0]}</button>`;

}

});

document
.getElementById("menu")
.innerHTML =
html;

}

catch(error){

document
.getElementById("menu")
.innerHTML =
"Error loading menus";

console.log(error);

}

}

loadMenus();

</script>

</body>

</html>
