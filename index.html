<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
  rel="stylesheet"
>

<script
  src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
</script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:linear-gradient(
    135deg,
    #f8fafc,
    #eef2ff
  );
  color:#111827;
}


/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:260px;
  height:100vh;
  background:white;
  padding:30px;
  box-shadow:2px 0 20px rgba(0,0,0,.05);
  overflow:auto;
}

.logo{
  font-size:34px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:10px;
}

.tag{
  color:gray;
  margin-bottom:40px;
}


/* MAIN */

.main{
  margin-left:280px;
  padding:40px;
}

.title{
  font-size:42px;
  font-weight:700;
}

.subtitle{
  color:gray;
  margin-bottom:40px;
}


/* CARDS */

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.metric{
  font-size:34px;
  font-weight:700;
  margin-top:10px;
}


/* PRICE DISPARITY */

#priceDisparitySection{
  display:none;
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:30px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}


/* UPLOAD */

.upload{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
  max-width:650px;
}

.upload h2{
  margin-bottom:20px;
}

.upload label{
  font-size:14px;
  font-weight:600;
}

.upload input,
.upload select{
  width:100%;
  padding:12px;
  margin:10px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:'Inter',Arial,sans-serif;
}

.upload button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-family:'Inter',Arial,sans-serif;
}

.upload button:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* STATUS */

.upload-status{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.upload-status.success{
  display:block;
  background:#ecfdf5;
  color:#065f46;
}

.upload-status.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}


/* FILE INFO */

.file-info{
  display:none;
  margin-top:18px;
  padding:18px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
}

.file-info-title{
  font-weight:700;
  margin-bottom:10px;
}

.file-info-row{
  margin-top:7px;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

.validation-success{
  color:#047857;
  font-weight:600;
}

.validation-error{
  color:#b91c1c;
  font-weight:600;
}


/* FOOTER */

.footer{
  margin-top:40px;
  color:gray;
}

</style>

</head>


<body>


<div class="sidebar">

  <div class="logo">
    WakeSuite
  </div>

  <div class="tag">
    Marketplace Intelligence
  </div>

</div>


<div class="main">

  <div class="title">
    Dashboard
  </div>

  <div class="subtitle">
    Wakefit Marketplace Operations
  </div>


  <div class="cards">

    <div
      class="card"
      onclick="showPriceDisparity()"
      style="cursor:pointer;"
    >

      Price Disparity

      <div
        class="metric"
        id="priceDisparityCount"
      >
        0
      </div>

    </div>


    <div class="card">

      Buy Box

      <div class="metric">
        42
      </div>

    </div>


    <div class="card">

      Reports

      <div class="metric">
        532
      </div>

    </div>

  </div>


  <div id="priceDisparitySection">

    <h2>
      Price Disparity Details
    </h2>

    <table
      id="priceDisparityTable"
      style="
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
      "
    >
    </table>

  </div>


  <div class="upload">

    <h2>
      Upload Report
    </h2>


    <label>
      Report Date
    </label>

    <input
      type="date"
      id="reportDate"
    >


    <label>
      Menu
    </label>

    <select id="menu">

      <option value="">
        Loading from Firebase...
      </option>

    </select>


    <label>
      Folder
    </label>

    <select id="folder">

      <option value="">
        Loading...
      </option>

    </select>


    <label>
      File
    </label>

    <input
      type="file"
      id="file"
      accept=".csv,.txt,.tsv,.xlsx,.xls"
    >


    <button
      id="uploadButton"
      onclick="uploadData()"
    >
      Upload
    </button>


    <div
      id="uploadStatus"
      class="upload-status"
    >
    </div>


    <div
      id="fileInfo"
      class="file-info"
    >

      <div class="file-info-title">
        Parsed Report
      </div>

      <div
        class="file-info-row"
        id="parsedFileName"
      ></div>

      <div
        class="file-info-row"
        id="parsedSheetName"
      ></div>

      <div
        class="file-info-row"
        id="parsedRowCount"
      ></div>

      <div
        class="file-info-row"
        id="parsedHeaders"
      ></div>

      <div
        class="file-info-row"
        id="detectedReport"
      ></div>

      <div
        class="file-info-row"
        id="validationResult"
      ></div>

    </div>

  </div>


  <div class="footer">
    WakeSuite © 2026
  </div>

</div>



<script>


/* ======================================================
   FIRESTORE UPLOAD CONFIG
====================================================== */

let uploadConfig = [];


/* ======================================================
   CURRENT VALIDATED REPORT DEFINITIONS
====================================================== */

const REPORT_DEFINITIONS = {


  wakefitDailyPricing: {

    id:
      "wakefit_daily_pricing",

    label:
      "Wakefit → Daily Pricing Sheet",

    requiredHeaders: [

      "scm_master_category",

      "item_sku",

      "mrp",

      "sale_price",

      "active"

    ]

  },


  amazonAllListings: {

    id:
      "amazon_all_listings",

    label:
      "Amazon → All Listings Report",

    requiredHeaders: [

      "seller-sku",

      "asin1",

      "item-name",

      "price",

      "quantity",

      "status",

      "minimum-seller-allowed-price",

      "maximum-seller-allowed-price",

      "expedited-shipping",

      "fulfillment-channel",

      "merchant-shipping-group",

      "maximum-retail-price"

    ]

  },


  amazonFbaInventory: {

    id:
      "amazon_fba_inventory",

    label:
      "Amazon → FBA Inventory",

    requiredHeaders: [

      "seller-sku",

      "fulfillment-channel-sku",

      "asin",

      "condition-type",

      "Warehouse-Condition-code",

      "Quantity Available"

    ]

  }


};



/* ======================================================
   RECEIVE CONFIG FROM FIREBASE MODULE
====================================================== */

window.applyUploadConfig =
function(configs){


  uploadConfig =
    configs

    .filter(
      item =>
        item.active === true
    )

    .sort(
      (a,b) =>
        Number(
          a.sortOrder || 0
        )
        -
        Number(
          b.sortOrder || 0
        )
    );


  console.log(
    "Upload configuration loaded:",
    uploadConfig
  );


  populateMenus();


  populateFolders();

};



/* ======================================================
   PRICE DISPARITY
====================================================== */

function showPriceDisparity(){


  const section =
    document
    .getElementById(
      "priceDisparitySection"
    );


  section.style.display =

    section.style.display ===
    "block"

    ?

    "none"

    :

    "block";

}



/* ======================================================
   SAFE HTML
====================================================== */

function escapeHtml(value){


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/* ======================================================
   POPULATE MENUS FROM FIRESTORE CONFIG
====================================================== */

function populateMenus(){


  const menuElement =
    document
    .getElementById(
      "menu"
    );


  const menus =
    [];


  uploadConfig.forEach(
    item => {


      if(
        item.menu &&
        !menus.includes(
          item.menu
        )
      ){

        menus.push(
          item.menu
        );

      }


    }
  );


  if(
    menus.length === 0
  ){

    menuElement.innerHTML =

      `<option value="">No menus configured</option>`;


    return;

  }


  let html = "";


  menus.forEach(
    menu => {


      html +=

        `<option value="${escapeHtml(menu)}">${escapeHtml(menu)}</option>`;


    }
  );


  menuElement.innerHTML =
    html;

}



/* ======================================================
   POPULATE FOLDERS FROM FIRESTORE CONFIG
====================================================== */

function populateFolders(){


  const menu =
    document
    .getElementById(
      "menu"
    )
    .value;


  const folderElement =
    document
    .getElementById(
      "folder"
    );


  let html =

    `<option value="">Select Folder</option>`;


  uploadConfig

  .filter(
    item =>
      item.menu === menu
  )

  .forEach(
    item => {


      html +=

        `<option value="${escapeHtml(item.folder)}">${escapeHtml(item.folder)}</option>`;


    }
  );


  folderElement.innerHTML =
    html;

}



document
.getElementById(
  "menu"
)
.addEventListener(
  "change",
  populateFolders
);



/* ======================================================
   STATUS
====================================================== */

function setUploadStatus(
  message,
  type
){


  const element =
    document
    .getElementById(
      "uploadStatus"
    );


  element.className =
    "upload-status " +
    type;


  element.textContent =
    message;

}



/* ======================================================
   HEADER NORMALIZATION
====================================================== */

function canonicalHeader(value){


  return String(
    value ?? ""
  )

  .replace(
    /^\uFEFF/,
    ""
  )

  .trim()

  .toLowerCase()

  .replace(
    /[^a-z0-9]/g,
    ""
  );

}



function cleanHeader(value){


  return String(
    value ?? ""
  )

  .replace(
    /^\uFEFF/,
    ""
  )

  .trim();

}



/* ======================================================
   REMOVE EMPTY SHEETJS HEADERS
====================================================== */

function isUsefulHeader(header){


  const value =
    String(
      header || ""
    )
    .trim();


  if(
    !value
  ){

    return false;

  }


  if(
    value ===
    "__EMPTY"
  ){

    return false;

  }


  if(
    value.startsWith(
      "__EMPTY_"
    )
  ){

    return false;

  }


  return true;

}



/* ======================================================
   NORMALIZE ROW
====================================================== */

function normalizeRow(row){


  const cleaned = {};


  Object.entries(
    row
  )
  .forEach(
    ([key,value]) => {


      const cleanKey =
        cleanHeader(
          key
        );


      if(
        !isUsefulHeader(
          cleanKey
        )
      ){

        return;

      }


      cleaned[
        cleanKey
      ] =
        value;


    }
  );


  return cleaned;

}



/* ======================================================
   HEADER CHECK
====================================================== */

function reportMatchesHeaders(
  headers,
  definition
){


  const available =
    new Set(
      headers.map(
        canonicalHeader
      )
    );


  const missing =
    definition
    .requiredHeaders
    .filter(
      requiredHeader =>

        !available.has(
          canonicalHeader(
            requiredHeader
          )
        )

    );


  return {

    matches:
      missing.length === 0,

    missingHeaders:
      missing

  };

}



/* ======================================================
   AUTO DETECT CURRENTLY KNOWN REPORTS
====================================================== */

function detectReport(headers){


  const definitions =
    Object.values(
      REPORT_DEFINITIONS
    );


  for(
    const definition
    of definitions
  ){


    const check =
      reportMatchesHeaders(
        headers,
        definition
      );


    if(
      check.matches
    ){

      return definition;

    }

  }


  return null;

}



/* ======================================================
   EXPECTED REPORT FROM FIRESTORE CONFIG ID
====================================================== */

function getSelectedConfig(
  menu,
  folder
){


  return uploadConfig.find(
    item =>

      item.menu === menu

      &&

      item.folder === folder

  )
  ||
  null;

}



/* ======================================================
   GET VALIDATION DEFINITION
====================================================== */

function getDefinitionFromConfig(
  config
){


  if(
    !config
  ){

    return null;

  }


  if(
    config.id ===
    "wakefit_daily_pricing"
  ){

    return REPORT_DEFINITIONS
      .wakefitDailyPricing;

  }


  if(
    config.id ===
    "amazon_all_listings"
  ){

    return REPORT_DEFINITIONS
      .amazonAllListings;

  }


  if(
    config.id ===
    "amazon_fba_inventory"
  ){

    return REPORT_DEFINITIONS
      .amazonFbaInventory;

  }


  /*
    Business Reports schema will be
    added after you provide its headers.

    Flipkart validation will also be
    added later with its finalized logic.
  */

  return null;

}



/* ======================================================
   VALIDATE REPORT
====================================================== */

function validateSelectedReport(
  menu,
  folder,
  headers
){


  const selectedConfig =
    getSelectedConfig(
      menu,
      folder
    );


  const selectedDefinition =
    getDefinitionFromConfig(
      selectedConfig
    );


  const detectedDefinition =
    detectReport(
      headers
    );


  if(
    !selectedConfig
  ){

    return {

      valid:false,

      selectedLabel:
        menu +
        " → " +
        folder,

      detectedLabel:
        detectedDefinition
        ?
        detectedDefinition.label
        :
        "Unknown report",

      missingHeaders:[],

      message:
        "Upload configuration was not found."

    };

  }


  if(
    !selectedDefinition
  ){

    return {

      valid:false,

      selectedLabel:
        menu +
        " → " +
        folder,

      detectedLabel:
        detectedDefinition
        ?
        detectedDefinition.label
        :
        "Validation pending",

      missingHeaders:[],

      message:
        "Validation is not configured yet for this report type."

    };

  }


  const check =
    reportMatchesHeaders(
      headers,
      selectedDefinition
    );


  if(
    check.matches
  ){

    return {

      valid:true,

      selectedLabel:
        selectedDefinition.label,

      detectedLabel:
        detectedDefinition
        ?
        detectedDefinition.label
        :
        selectedDefinition.label,

      detectedId:
        selectedDefinition.id,

      missingHeaders:[],

      message:
        "Report validation passed."

    };

  }


  return {

    valid:false,

    selectedLabel:
      selectedDefinition.label,

    detectedLabel:
      detectedDefinition
      ?
      detectedDefinition.label
      :
      "Unknown report",

    missingHeaders:
      check.missingHeaders,

    message:
      "The selected report does not match the uploaded file."

  };

}



/* ======================================================
   SHOW FILE INFO
====================================================== */

function showParsedFileInfo(
  parsedFile,
  validation
){


  document
  .getElementById(
    "fileInfo"
  )
  .style.display =
    "block";


  document
  .getElementById(
    "parsedFileName"
  )
  .textContent =

    "File: " +
    parsedFile.fileName;


  document
  .getElementById(
    "parsedSheetName"
  )
  .textContent =

    "Sheet: " +
    parsedFile.sheetName;


  document
  .getElementById(
    "parsedRowCount"
  )
  .textContent =

    "Rows: " +
    parsedFile.rowCount;


  document
  .getElementById(
    "parsedHeaders"
  )
  .textContent =

    "Columns: " +
    parsedFile.headers.join(
      ", "
    );


  document
  .getElementById(
    "detectedReport"
  )
  .textContent =

    "Detected report: " +
    validation.detectedLabel;


  const validationElement =
    document
    .getElementById(
      "validationResult"
    );


  if(
    validation.valid
  ){


    validationElement.className =

      "file-info-row validation-success";


    validationElement.textContent =

      "✓ Validation passed";


  }
  else{


    validationElement.className =

      "file-info-row validation-error";


    validationElement.textContent =

      "✕ " +
      validation.message;


  }

}



/* ======================================================
   READ FILE
====================================================== */

async function readWakeSuiteFile(file){


  if(
    !file
  ){

    throw new Error(
      "No file selected."
    );

  }


  if(
    typeof XLSX ===
    "undefined"
  ){

    throw new Error(
      "Spreadsheet reader is not loaded."
    );

  }


  console.log(
    "Reading file:",
    file.name
  );


  const buffer =
    await file.arrayBuffer();


  let workbook;


  try{


    workbook =
      XLSX.read(
        buffer,
        {

          type:"array",

          cellDates:false

        }
      );


  }
  catch(error){


    console.error(
      error
    );


    throw new Error(
      "WakeSuite could not read this file."
    );

  }


  if(
    !workbook.SheetNames ||
    workbook.SheetNames.length === 0
  ){

    throw new Error(
      "No worksheet or data was found."
    );

  }


  const firstSheetName =
    workbook.SheetNames[0];


  const worksheet =
    workbook.Sheets[
      firstSheetName
    ];


  let rows =
    XLSX.utils.sheet_to_json(
      worksheet,
      {

        defval:"",

        raw:false,

        blankrows:false

      }
    );


  rows =
    rows.map(
      normalizeRow
    );


  rows =
    rows.filter(
      row =>

        Object.values(
          row
        )
        .some(
          value =>

            String(
              value ?? ""
            )
            .trim() !== ""

        )
    );


  const headers =
    rows.length > 0
    ?
    Object.keys(
      rows[0]
    )
    :
    [];


  console.log(
    "Sheet:",
    firstSheetName
  );


  console.log(
    "Headers:",
    headers
  );


  console.log(
    "Total rows:",
    rows.length
  );


  console.log(
    "First 3 rows:",
    rows.slice(
      0,
      3
    )
  );


  return {

    fileName:
      file.name,

    fileSize:
      file.size,

    mimeType:
      file.type ||
      "unknown",

    sheetName:
      firstSheetName,

    headers:
      headers,

    rowCount:
      rows.length,

    rows:
      rows

  };

}



/* ======================================================
   UPLOAD
====================================================== */

async function uploadData(){


  const reportDate =
    document
    .getElementById(
      "reportDate"
    )
    .value;


  const menu =
    document
    .getElementById(
      "menu"
    )
    .value;


  const folder =
    document
    .getElementById(
      "folder"
    )
    .value;


  const file =
    document
    .getElementById(
      "file"
    )
    .files[0];


  const uploadButton =
    document
    .getElementById(
      "uploadButton"
    );


  if(
    !reportDate
  ){

    alert(
      "Please select Report Date."
    );

    return;

  }


  if(
    !menu
  ){

    alert(
      "Please select Menu."
    );

    return;

  }


  if(
    !folder
  ){

    alert(
      "Please select Folder."
    );

    return;

  }


  if(
    !file
  ){

    alert(
      "Please choose a file."
    );

    return;

  }


  if(
    typeof
    window.saveUploadMetadata
    !==
    "function"
  ){

    alert(
      "Firebase is not ready. Please refresh WakeSuite."
    );

    return;

  }


  try{


    uploadButton.disabled =
      true;


    uploadButton.innerText =
      "Reading report...";


    setUploadStatus(
      "Reading and validating report...",
      "success"
    );


    const parsedFile =
      await readWakeSuiteFile(
        file
      );


    window.currentWakeSuiteFile =
      file;


    window.currentWakeSuiteParsed =
      parsedFile;


    const validation =
      validateSelectedReport(
        menu,
        folder,
        parsedFile.headers
      );


    console.log(
      "Validation:",
      validation
    );


    showParsedFileInfo(
      parsedFile,
      validation
    );


    if(
      !validation.valid
    ){


      let message =

        validation.message +

        "\n\nSelected:\n" +

        validation.selectedLabel +

        "\n\nDetected:\n" +

        validation.detectedLabel;


      if(
        validation.missingHeaders.length > 0
      ){


        message +=

          "\n\nMissing columns:\n" +

          validation
          .missingHeaders
          .join(
            ", "
          );

      }


      message +=

        "\n\nNothing was saved to Firestore.";


      setUploadStatus(
        validation.message,
        "error"
      );


      alert(
        message
      );


      return;

    }


    uploadButton.innerText =
      "Registering...";


    const selectedConfig =
      getSelectedConfig(
        menu,
        folder
      );


    const metadata = {

      reportDate:
        reportDate,

      menu:
        menu,

      reportType:
        folder,

      configId:
        selectedConfig.id,

      detectedReport:
        validation.detectedLabel,

      detectedReportId:
        validation.detectedId,

      validationStatus:
        "Valid",

      fileName:
        file.name,

      fileSize:
        file.size,

      mimeType:
        file.type ||
        "unknown",

      lastModified:
        file.lastModified,

      sheetName:
        parsedFile.sheetName,

      rowCount:
        parsedFile.rowCount,

      headers:
        parsedFile.headers,

      status:
        "Ready for processing",

      processed:
        false,

      rawFileStored:
        false

    };


    const uploadId =
      await window
      .saveUploadMetadata(
        metadata
      );


    window.currentWakeSuiteUpload = {

      uploadId:
        uploadId,

      reportDate:
        reportDate,

      menu:
        menu,

      reportType:
        folder,

      file:
        file,

      parsedFile:
        parsedFile

    };


    setUploadStatus(

      "Validation passed. " +
      parsedFile.rowCount +
      " rows detected. Ready for processing.",

      "success"

    );


    alert(

      "Report validated and registered successfully.\n\n" +

      "Report: " +
      validation.detectedLabel +

      "\n\nRows: " +
      parsedFile.rowCount +

      "\n\nThe raw file was NOT uploaded to cloud storage."

    );


  }
  catch(error){


    console.error(
      "WakeSuite error:",
      error
    );


    setUploadStatus(
      "Unable to process report: " +
      error.message,
      "error"
    );


    alert(
      "Unable to process report.\n\n" +
      error.message
    );


  }
  finally{


    uploadButton.disabled =
      false;


    uploadButton.innerText =
      "Upload";

  }

}


</script>

async function loadUploadConfigFromFirestore(){


  console.log(
    "Loading upload configuration from Firestore..."
  );


  const snapshot =
    await getDocs(
      collection(
        db,
        "upload_config"
      )
    );


  const configs = [];


  snapshot.forEach(
    documentSnapshot => {


      configs.push({

        id:
          documentSnapshot.id,

        ...documentSnapshot.data()

      });


    }
  );


  console.log(
    "Firestore configuration documents:",
    configs
  );


  window.applyUploadConfig(
    configs
  );

}

async function(metadata){


  const user =
    auth.currentUser;


  if(
    !user
  ){

    throw new Error(
      "You must be signed in to WakeSuite."
    );

  }


  const documentReference =
    await addDoc(

      collection(
        db,
        "uploads"
      ),

      {

        ...metadata,

        userId:
          user.uid,

        userEmail:
          user.email ||
          "",

        uploadedAt:
          serverTimestamp()

      }

    );


  return documentReference.id;

};
