<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

/* =====================
GLOBAL
===================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(
135deg,
#f8fafc,
#eef2ff
);

color:#111827;

}


/* =====================
SIDEBAR
===================== */

.sidebar{

position:fixed;

top:0;
left:0;

width:260px;
height:100vh;

background:white;

padding:35px;

box-shadow:
2px 0 20px rgba(0,0,0,.05);

overflow:auto;

}


.logo{

font-size:34px;
font-weight:700;

color:#2563eb;

margin-bottom:10px;

}


.tag{

color:gray;

margin-bottom:40px;

}


.menu{

padding:18px;

margin-bottom:12px;

background:white;

border-radius:14px;

cursor:pointer;

font-weight:600;

box-shadow:
0 3px 12px rgba(0,0,0,.05);

transition:.2s;

}


.menu:hover{

background:#eff6ff;

transform:
translateX(5px);

}


.folder{

padding:12px;

margin:
8px 0 8px 25px;

background:#f5f7fa;

border-radius:10px;

font-size:14px;

}



/* =====================
MAIN
===================== */

.main{

margin-left:280px;

padding:40px;

}


.title{

font-size:42px;

font-weight:700;

}


.subtitle{

color:gray;

margin-top:8px;

margin-bottom:40px;

}



/* =====================
CARDS
===================== */

.cards{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(220px,1fr)
);

gap:20px;

margin-bottom:40px;

}


.card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:
0 8px 25px rgba(0,0,0,.05);

}


.metric{

font-size:34px;

font-weight:700;

margin-top:10px;

}



/* =====================
STATUS
===================== */

.status{

background:white;

padding:30px;

border-radius:20px;

box-shadow:
0 8px 25px rgba(0,0,0,.05);

margin-bottom:40px;

}



/* =====================
UPLOAD
===================== */

.upload{

background:white;

padding:30px;

border-radius:20px;

box-shadow:
0 8px 25px rgba(0,0,0,.05);

max-width:600px;

}


.upload input,
.upload select{

width:100%;

padding:12px;

margin-top:12px;

margin-bottom:20px;

border:

1px solid #ddd;

border-radius:10px;

}


.upload button{

padding:14px 20px;

background:#2563eb;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;

}


.upload button:hover{

background:#1d4ed8;

}


.footer{

margin-top:40px;

color:gray;

font-size:14px;

}

</style>

</head>



<body>



<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

WakeSuite

</div>


<div class="tag">

Marketplace Intelligence

</div>


<div id="sidebar">

Loading...

</div>

</div>



<!-- MAIN -->

<div class="main">


<div class="title">

Dashboard

</div>


<div class="subtitle">

Wakefit Marketplace Operations

</div>



<div class="cards">

<div class="card">

Suppression

<div class="metric">

128

</div>

</div>


<div class="card">

Buy Box

<div class="metric">

42

</div>

</div>


<div class="card">

Price Alerts

<div class="metric">

18

</div>

</div>


<div class="card">

Reports

<div class="metric">

532

</div>

</div>

</div>



<div class="status">

<b>System Health</b>

<br><br>

Google Sheets → Connected

<br>

Apps Script → Active

<br>

GitHub → Live

<br>

WakeSuite → Running

</div>



<!-- UPLOAD CENTER -->

<div class="upload">

<h2>

Upload Report

</h2>


<input
type="date"
id="reportDate">


<select id="menu">

<option>
Wakefit
</option>

<option>
Amazon
</option>

<option>
Flipkart
</option>

</select>


<input
type="text"

placeholder="Folder"

id="folder">


<input
type="file"

id="file">


<button>

Upload

</button>


</div>



<div class="footer">

WakeSuite © 2026

</div>


</div>




<script>

async function load(){

try{

let response =
await fetch(

"https://script.google.com/macros/s/AKfycbwe1CK3w2veuRPZdHDIo7LWHptdk5uU1UVJMjGlTtnqyHswEsZzeX3cfjuo2iyj3sQL/exec"

);

let data =
await response.json();

let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

let html="";


menus.forEach(menu=>{

if(menu[1]){

html +=

`

<div
class="menu"

onclick="
toggle('${menu[0]}')
">

${menu[0]}

</div>


<div
id="${menu[0]}"
style="display:none">

`;


folders.forEach(folder=>{

if(

folder[0]===menu[0]

&& folder[2]

){

html +=

`

<div class="folder">

📁 ${folder[1]}

</div>

`;

}

});


html +=
`</div>`;

}

});


document
.getElementById(
"sidebar"
)
.innerHTML =
html;

}


catch(error){

document
.getElementById(
"sidebar"
)
.innerHTML =

"Error loading";

console.log(error);

}

}



function toggle(id){

let x =
document.getElementById(id);

x.style.display =

x.style.display==="none"

?

"block"

:

"none";

}


load();

</script>



</body>

</html>
