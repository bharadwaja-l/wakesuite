<!DOCTYPE html>
<html>

<head>
<title>WakeSuite</title>

<style>

body{
font-family:Arial;
padding:30px;
}

button{
display:block;
margin:8px 0;
padding:12px;
width:220px;
}

.folder{
margin-left:30px;
padding:5px;
}

</style>

</head>

<body>

<h1>WakeSuite</h1>

<div id="content">
Loading...
</div>

<script>

async function loadData(){

try{

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbzy85O8cTZs50vmSE381oDh8QKOVwrsPTIRjcW7NNIdiBM0I3GOTOsDw_2mdFGK_3c1/exec"
);

let data =
await response.json();

console.log(data);

let html="";

let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

menus.forEach(menu=>{

if(menu[1]){

html +=
`<button onclick="toggle('${menu[0]}')">

${menu[0]}

</button>

<div id="${menu[0]}"
style="display:none">`;

folders.forEach(folder=>{

if(
folder[0]===menu[0]
&& folder[2]
){

html +=
`<div class="folder">

• ${folder[1]}

</div>`;

}

});

html +=
`</div>`;

}

});

document
.getElementById("content")
.innerHTML =
html;

}

catch(error){

document
.getElementById("content")
.innerHTML =
"ERROR: " + error;

console.log(error);

}

}

function toggle(id){

let x =
document.getElementById(id);

x.style.display =
x.style.display==="none"
?
"block"
:
"none";

}

loadData();

</script>

</body>
</html>
