<!DOCTYPE html>
<html>
<head>

<title>WakeSuite</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
  rel="stylesheet"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter', Arial, sans-serif;
  background:
    linear-gradient(
      135deg,
      #f8fafc,
      #eef2ff
    );
  color:#111827;
}


/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:260px;
  height:100vh;
  background:white;
  padding:30px;
  box-shadow:
    2px 0 20px rgba(0,0,0,.05);
  overflow:auto;
}

.logo{
  font-size:34px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:10px;
}

.tag{
  color:gray;
  margin-bottom:40px;
}

.menu{
  padding:16px;
  background:white;
  margin-bottom:10px;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
  box-shadow:
    0 2px 10px rgba(0,0,0,.05);
}

.folder{
  padding:12px;
  margin:8px 0 8px 25px;
  background:#f5f7fa;
  border-radius:10px;
}


/* MAIN */

.main{
  margin-left:280px;
  padding:40px;
}

.title{
  font-size:42px;
  font-weight:700;
}

.subtitle{
  color:gray;
  margin-bottom:40px;
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:
    0 6px 20px rgba(0,0,0,.05);
}

.metric{
  font-size:34px;
  font-weight:700;
  margin-top:10px;
}


/* PRICE DISPARITY SECTION */

#priceDisparitySection{
  display:none;
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:30px;
  box-shadow:
    0 6px 20px rgba(0,0,0,.05);
}


/* UPLOAD */

.upload{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:
    0 6px 20px rgba(0,0,0,.05);
  max-width:650px;
}

.upload h2{
  margin-bottom:20px;
}

.upload label{
  font-size:14px;
  font-weight:600;
}

.upload input,
.upload select{
  width:100%;
  padding:12px;
  margin:10px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:'Inter', Arial, sans-serif;
}

.upload button{
  padding:14px;
  width:100%;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-family:'Inter', Arial, sans-serif;
}

.upload button:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* STATUS */

.upload-status{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.upload-status.success{
  display:block;
  background:#ecfdf5;
  color:#065f46;
}

.upload-status.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}


/* FOOTER */

.footer{
  margin-top:40px;
  color:gray;
}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    WakeSuite
  </div>

  <div class="tag">
    Marketplace Intelligence
  </div>

  <div id="sidebar"></div>

</div>



<!-- MAIN -->

<div class="main">

  <div class="title">
    Dashboard
  </div>

  <div class="subtitle">
    Wakefit Marketplace Operations
  </div>



  <!-- CARDS -->

  <div class="cards">

    <div
      class="card"
      onclick="showPriceDisparity()"
      style="cursor:pointer;"
    >

      Price Disparity

      <div
        class="metric"
        id="priceDisparityCount"
      >
        0
      </div>

    </div>


    <div class="card">

      Buy Box

      <div class="metric">
        42
      </div>

    </div>


    <div class="card">

      Reports

      <div class="metric">
        532
      </div>

    </div>

  </div>



  <!-- PRICE DISPARITY DETAILS -->

  <div id="priceDisparitySection">

    <h2>
      Price Disparity Details
    </h2>

    <table
      id="priceDisparityTable"
      style="
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
      "
    >
    </table>

  </div>



  <!-- UPLOAD -->

  <div class="upload">

    <h2>
      Upload Report
    </h2>


    <label>
      Report Date
    </label>

    <input
      type="date"
      id="reportDate"
    >


    <label>
      Menu
    </label>

    <select id="menu">

      <option>
        Loading...
      </option>

    </select>


    <label>
      Folder
    </label>

    <select id="folder">

      <option>
        Loading...
      </option>

    </select>


    <label>
      File
    </label>

    <input
      type="file"
      id="file"
    >


    <button
      id="uploadButton"
      onclick="uploadData()"
    >
      Upload
    </button>


    <div
      id="uploadStatus"
      class="upload-status"
    >
    </div>

  </div>



  <div class="footer">
    WakeSuite © 2026
  </div>

</div>



<!-- ======================================================
     EXISTING WAKESUITE LOGIC
====================================================== -->

<script>

const CONFIG_URL =
"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec";


let allFolders = [];


/* ======================================================
   LOAD CONFIG
====================================================== */

async function load(){

  try{

    const response =
      await fetch(
        CONFIG_URL
      );


    if(!response.ok){

      throw new Error(
        "Unable to load WakeSuite configuration."
      );

    }


    const data =
      await response.json();


    const uploads =
      data.uploads
      ?
      data.uploads.slice(1)
      :
      [];


    if(
      data.priceDisparity &&
      data.priceDisparity.length > 1
    ){

      document
      .getElementById(
        "priceDisparityCount"
      )
      .innerText =
        data.priceDisparity.length - 1;

    }


    allFolders =
      uploads;


    populateMenus(
      uploads
    );


    populateFolders();


  }
  catch(error){

    console.error(
      "WakeSuite config error:",
      error
    );


    document
    .getElementById(
      "sidebar"
    )
    .innerHTML =
      "Unable to load configuration.";

  }

}



/* ======================================================
   PRICE DISPARITY SECTION
====================================================== */

function showPriceDisparity(){

  const section =
    document.getElementById(
      "priceDisparitySection"
    );


  if(
    section.style.display ===
    "block"
  ){

    section.style.display =
      "none";

  }
  else{

    section.style.display =
      "block";

  }

}



/* ======================================================
   TOGGLE
====================================================== */

function toggle(id){

  const element =
    document.getElementById(
      id
    );


  element.style.display =
    element.style.display ===
    "none"
    ?
    "block"
    :
    "none";

}



/* ======================================================
   POPULATE MENU
====================================================== */

function populateMenus(uploads){

  let html = "";

  const seen =
    new Set();


  uploads.forEach(
    row => {

      const menu =
        row[0];

      const active =
        row[2];


      if(
        menu &&
        active &&
        !seen.has(menu)
      ){

        seen.add(
          menu
        );


        html +=
          `<option value="${escapeHtml(menu)}">${escapeHtml(menu)}</option>`;

      }

    }
  );


  if(!html){

    html =
      `<option value="">No menus available</option>`;

  }


  document
  .getElementById(
    "menu"
  )
  .innerHTML =
    html;

}



/* ======================================================
   POPULATE FOLDERS
====================================================== */

function populateFolders(){

  const selectedMenu =
    document
    .getElementById(
      "menu"
    )
    .value;


  let html =
    `<option value="">Select Folder</option>`;


  allFolders.forEach(
    row => {

      const menu =
        row[0];

      const folder =
        row[1];

      const active =
        row[2];


      if(
        menu === selectedMenu &&
        folder &&
        active
      ){

        html +=
          `<option value="${escapeHtml(folder)}">${escapeHtml(folder)}</option>`;

      }

    }
  );


  document
  .getElementById(
    "folder"
  )
  .innerHTML =
    html;

}



document
.getElementById(
  "menu"
)
.addEventListener(
  "change",
  populateFolders
);



/* ======================================================
   HTML SAFETY
====================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}



/* ======================================================
   UPLOAD STATUS
====================================================== */

function setUploadStatus(
  message,
  type
){

  const element =
    document.getElementById(
      "uploadStatus"
    );


  element.className =
    "upload-status " +
    type;


  element.textContent =
    message;

}



/* ======================================================
   NEW FIREBASE UPLOAD FLOW

   IMPORTANT:
   Raw files are NOT uploaded to Drive
   and are NOT uploaded to Firebase Storage.

   Only metadata is stored in Firestore.
====================================================== */

async function uploadData(){

  const reportDate =
    document
    .getElementById(
      "reportDate"
    )
    .value;


  const menu =
    document
    .getElementById(
      "menu"
    )
    .value;


  const folder =
    document
    .getElementById(
      "folder"
    )
    .value;


  const fileInput =
    document
    .getElementById(
      "file"
    );


  const file =
    fileInput.files[0];


  const uploadButton =
    document
    .getElementById(
      "uploadButton"
    );


  /* VALIDATION */

  if(!reportDate){

    alert(
      "Please select Report Date."
    );

    return;

  }


  if(!menu){

    alert(
      "Please select Menu."
    );

    return;

  }


  if(!folder){

    alert(
      "Please select Folder."
    );

    return;

  }


  if(!file){

    alert(
      "Please choose a file."
    );

    return;

  }


  if(
    typeof
    window.saveUploadMetadata
    !==
    "function"
  ){

    alert(
      "Firebase is not ready yet. Please refresh WakeSuite and try again."
    );

    return;

  }


  try{

    uploadButton.disabled =
      true;


    uploadButton.innerText =
      "Registering...";


    setUploadStatus(
      "Registering report...",
      "success"
    );


    /*
      Keep the actual File object
      inside this browser session.

      This will be used by the next
      processing step.
    */

    window.currentWakeSuiteFile =
      file;


    const metadata = {

      reportDate:
        reportDate,

      menu:
        menu,

      reportType:
        folder,

      fileName:
        file.name,

      fileSize:
        file.size,

      mimeType:
        file.type ||
        "unknown",

      lastModified:
        file.lastModified,

      status:
        "Ready for processing",

      processed:
        false,

      rawFileStored:
        false

    };


    const uploadId =
      await window
      .saveUploadMetadata(
        metadata
      );


    /*
      Keep upload information available
      for the next processing step.
    */

    window.currentWakeSuiteUpload = {

      uploadId:
        uploadId,

      reportDate:
        reportDate,

      menu:
        menu,

      reportType:
        folder,

      file:
        file

    };


    console.log(
      "WakeSuite upload registered:",
      uploadId
    );


    console.log(
      "Selected file:",
      file.name
    );


    console.log(
      "Report:",
      menu,
      folder
    );


    setUploadStatus(
      "Report registered successfully. File is ready for processing.",
      "success"
    );


    alert(
      "Report registered successfully.\n\n" +
      "File: " +
      file.name +
      "\n\n" +
      "The raw file has NOT been uploaded to cloud storage."
    );


  }
  catch(error){

    console.error(
      "Upload registration failed:",
      error
    );


    setUploadStatus(
      "Unable to register report: " +
      error.message,
      "error"
    );


    alert(
      "Unable to register report.\n\n" +
      error.message
    );

  }
  finally{

    uploadButton.disabled =
      false;


    uploadButton.innerText =
      "Upload";

  }

}



/* START WAKESUITE */

load();

</script>



<!-- ======================================================
     FIREBASE
====================================================== -->

<script type="module">


import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



/* ======================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAwOkR3aemcexscDptHVnRjxSQx3XmjuV4",

  authDomain:
    "wakesuite-4daf9.firebaseapp.com",

  projectId:
    "wakesuite-4daf9",

  storageBucket:
    "wakesuite-4daf9.firebasestorage.app",

  messagingSenderId:
    "34563161502",

  appId:
    "1:34563161502:web:9f0e9bc1e2da2d423d2a8f",

  measurementId:
    "G-VH7V68BSKD"

};



/* ======================================================
   INITIALIZE FIREBASE
====================================================== */

const app =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    app
  );


const db =
  getFirestore(
    app
  );


const provider =
  new GoogleAuthProvider();



/* ======================================================
   LOGIN SCREEN
====================================================== */

const loginOverlay =
  document.createElement(
    "div"
  );


loginOverlay.id =
  "firebaseLoginOverlay";


loginOverlay.innerHTML =
`
<div style="
  background:white;
  width:380px;
  max-width:90%;
  padding:40px;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  text-align:center;
  font-family:Inter,Arial,sans-serif;
">

  <div style="
    font-size:34px;
    font-weight:700;
    color:#2563eb;
    margin-bottom:8px;
  ">
    WakeSuite
  </div>


  <div style="
    color:#6b7280;
    margin-bottom:30px;
  ">
    Marketplace Intelligence
  </div>


  <button
    id="firebaseGoogleLogin"
    style="
      width:100%;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    "
  >
    Sign in with Google
  </button>

</div>
`;


Object.assign(
  loginOverlay.style,
  {

    position:
      "fixed",

    inset:
      "0",

    background:
      "#f8fafc",

    display:
      "flex",

    alignItems:
      "center",

    justifyContent:
      "center",

    zIndex:
      "99999"

  }
);


document.body.appendChild(
  loginOverlay
);



/* ======================================================
   GOOGLE LOGIN
====================================================== */

document
.getElementById(
  "firebaseGoogleLogin"
)
.addEventListener(
  "click",
  async () => {

    try{

      await signInWithPopup(
        auth,
        provider
      );

    }
    catch(error){

      console.error(
        "Google sign-in error:",
        error
      );


      alert(
        "Google sign-in failed: " +
        error.message
      );

    }

  }
);



/* ======================================================
   AUTHENTICATION CHECK
====================================================== */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      loginOverlay.style.display =
        "none";


      console.log(
        "WakeSuite user:",
        user.email
      );


      console.log(
        "Firebase UID:",
        user.uid
      );


      console.log(
        "WakeSuite Firebase ready"
      );

    }
    else{

      loginOverlay.style.display =
        "flex";

    }

  }
);



/* ======================================================
   FIRESTORE UPLOAD METADATA
====================================================== */

window.saveUploadMetadata =
async function(metadata){

  const user =
    auth.currentUser;


  if(!user){

    throw new Error(
      "You must be signed in to WakeSuite."
    );

  }


  const documentReference =
    await addDoc(

      collection(
        db,
        "uploads"
      ),

      {

        ...metadata,

        userId:
          user.uid,

        userEmail:
          user.email || "",

        uploadedAt:
          serverTimestamp()

      }

    );


  return documentReference.id;

};



/* ======================================================
   MAKE FIREBASE AVAILABLE TO WAKESUITE
====================================================== */

window.wakeSuiteFirebase = {

  app:
    app,

  auth:
    auth,

  db:
    db

};


</script>


</body>
</html>
