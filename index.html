<!DOCTYPE html>
<html>
<head>

<title>WakeSuite</title>

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter';
background:
linear-gradient(
135deg,
#f8fafc,
#eef2ff
);
color:#111827;
}


/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:white;
padding:30px;
box-shadow:
2px 0 20px rgba(0,0,0,.05);
overflow:auto;
}

.logo{
font-size:34px;
font-weight:700;
color:#2563eb;
margin-bottom:10px;
}

.tag{
color:gray;
margin-bottom:40px;
}

.menu{
padding:16px;
background:white;
margin-bottom:10px;
border-radius:14px;
cursor:pointer;
font-weight:600;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.folder{
padding:12px;
margin:
8px 0 8px 25px;
background:#f5f7fa;
border-radius:10px;
}


/* MAIN */

.main{
margin-left:280px;
padding:40px;
}

.title{
font-size:42px;
font-weight:700;
}

.subtitle{
color:gray;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:
0 6px 20px rgba(0,0,0,.05);
}

.metric{
font-size:34px;
font-weight:700;
margin-top:10px;
}

.upload{
background:white;
padding:30px;
border-radius:20px;
box-shadow:
0 6px 20px rgba(0,0,0,.05);
max-width:650px;
}

.upload input,
.upload select{
width:100%;
padding:12px;
margin:10px 0 20px;
border:1px solid #ddd;
border-radius:10px;
}

.upload button{
padding:14px;
width:100%;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.footer{
margin-top:40px;
color:gray;
}

</style>
</head>


<body>

<div class="sidebar">

<div class="logo">
WakeSuite
</div>

<div class="tag">
Marketplace Intelligence
</div>

<div id="sidebar">
</div>

</div>


<div class="main">

<div class="title">
Dashboard
</div>

<div class="subtitle">
Wakefit Marketplace Operations
</div>


<div class="cards">

<div
class="card"
onclick="showPriceDisparity()"
>

Price Disparity

<div
class="metric"
id="priceDisparityCount"
>
0
</div>

</div>


<div class="card">

Buy Box

<div class="metric">
42
</div>

</div>


<div class="card">

Reports

<div class="metric">
532
</div>

</div>

</div>


<div
id="priceDisparitySection"
style="
display:none;
background:white;
padding:20px;
border-radius:18px;
margin-top:20px;
box-shadow:0 6px 20px rgba(0,0,0,.05);
">

<h2>
Price Disparity Details
</h2>

<table
id="priceDisparityTable"
style="
width:100%;
border-collapse:collapse;
margin-top:15px;
">
</table>

</div>


<div class="upload">

<h2>
Upload Report
</h2>


<label>
Report Date
</label>

<input
type="date"
id="reportDate">


<label>
Menu
</label>

<select id="menu">

<option>
Loading...
</option>

</select>


<label>
Folder
</label>

<select id="folder">

<option>
Loading...
</option>

</select>


<label>
File
</label>

<input
type="file"
id="file">


<button
onclick="uploadData()"
id="uploadButton"
>

Upload

</button>

</div>


<div class="footer">

WakeSuite © 2026

</div>

</div>



<script>

let allFolders = [];


/* =========================
   LOAD CONFIG
========================= */

async function load(){

try{

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec"
);

let data =
await response.json();


let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

let uploads =
data.uploads.slice(1);


if(
data.priceDisparity &&
data.priceDisparity.length > 1
){

document
.getElementById(
"priceDisparityCount"
)
.innerText =
data.priceDisparity.length - 1;

}


allFolders =
uploads;


populateMenus(
uploads
);


populateFolders();

}

catch(err){

console.error(err);

document
.getElementById(
"sidebar"
)
.innerHTML =
err.toString();

}

}



/* =========================
   PRICE DISPARITY SECTION
========================= */

function showPriceDisparity(){

let section =
document.getElementById(
"priceDisparitySection"
);

if(
section.style.display ===
"none"
){

section.style.display =
"block";

}
else{

section.style.display =
"none";

}

}



/* =========================
   TOGGLE
========================= */

function toggle(id){

let x =
document.getElementById(id);

x.style.display =
x.style.display === "none"
?
"block"
:
"none";

}



/* =========================
   MENU
========================= */

function populateMenus(uploads){

let html = "";

let seen = [];


uploads.forEach(u => {

if(
u[2] &&
!seen.includes(
u[0]
)
){

seen.push(
u[0]
);

html +=
`
<option>
${u[0]}
</option>
`;

}

});


document
.getElementById(
"menu"
)
.innerHTML =
html;

}



/* =========================
   FOLDERS
========================= */

function populateFolders(){

let menu =
document
.getElementById(
"menu"
)
.value;


let html =
"<option>Select Folder</option>";


allFolders.forEach(f => {

if(
f[0] === menu &&
f[2]
){

html +=
`
<option>
${f[1]}
</option>
`;

}

});


document
.getElementById(
"folder"
)
.innerHTML =
html;

}


document
.getElementById(
"menu"
)
.addEventListener(
"change",
populateFolders
);



/* =========================
   NEW FIREBASE UPLOAD FLOW
========================= */

async function uploadData(){

const reportDate =
document
.getElementById(
"reportDate"
)
.value;


const menu =
document
.getElementById(
"menu"
)
.value;


const folder =
document
.getElementById(
"folder"
)
.value;


const file =
document
.getElementById(
"file"
)
.files[0];


const uploadButton =
document
.getElementById(
"uploadButton"
);


/* VALIDATION */

if(!reportDate){

alert(
"Please select Report Date."
);

return;

}


if(
!menu ||
menu === "Loading..."
){

alert(
"Please select Menu."
);

return;

}


if(
!folder ||
folder ===
"Select Folder" ||
folder ===
"Loading..."
){

alert(
"Please select Folder."
);

return;

}


if(!file){

alert(
"Please choose a file."
);

return;

}


if(
typeof window.saveUploadMetadata !==
"function"
){

alert(
"Firebase is not ready yet.\n\nPlease refresh WakeSuite and try again."
);

return;

}


try{

uploadButton.disabled =
true;

uploadButton.innerText =
"Registering...";


/*
The raw file stays in the browser.

Nothing is uploaded to Google Drive
or Firebase Storage.
*/

window.currentWakeSuiteFile =
file;


const uploadId =
await window.saveUploadMetadata({

reportDate:
reportDate,

menu:
menu,

reportType:
folder,

fileName:
file.name,

mimeType:
file.type ||
"unknown",

fileSize:
file.size,

status:
"Ready for processing",

rawFileStored:
false

});


window.currentWakeSuiteUpload = {

uploadId:
uploadId,

reportDate:
reportDate,

menu:
menu,

reportType:
folder,

file:
file

};


console.log(
"WakeSuite upload registered:",
uploadId
);


console.log(
"Selected file:",
file.name
);


console.log(
"Selected report:",
menu,
folder
);


alert(
"Report registered successfully.\n\n" +
"File: " +
file.name +
"\n\n" +
"The file is ready for WakeSuite processing."
);


}

catch(error){

console.error(
"Upload registration failed:",
error
);


alert(
"Unable to register report.\n\n" +
error.message
);

}

finally{

uploadButton.disabled =
false;

uploadButton.innerText =
"Upload";

}

}



load();

</script>



<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyAwOkR3aemcexscDptHVnRjxSQx3XmjuV4",

authDomain:
"wakesuite-4daf9.firebaseapp.com",

projectId:
"wakesuite-4daf9",

storageBucket:
"wakesuite-4daf9.firebasestorage.app",

messagingSenderId:
"34563161502",

appId:
"1:34563161502:web:9f0e9bc1e2da2d423d2a8f",

measurementId:
"G-VH7V68BSKD"

};



const app =
initializeApp(
firebaseConfig
);


const auth =
getAuth(
app
);


const db =
getFirestore(
app
);


const provider =
new GoogleAuthProvider();



/* =========================
   LOGIN SCREEN
========================= */

const loginOverlay =
document.createElement(
"div"
);


loginOverlay.id =
"firebaseLoginOverlay";


loginOverlay.innerHTML =
`
<div style="
background:white;
width:380px;
max-width:90%;
padding:40px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,.15);
text-align:center;
font-family:Inter,Arial,sans-serif;
">

<div style="
font-size:34px;
font-weight:700;
color:#2563eb;
margin-bottom:8px;
">

WakeSuite

</div>


<div style="
color:#6b7280;
margin-bottom:30px;
">

Marketplace Intelligence

</div>


<button
id="firebaseGoogleLogin"
style="
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
"
>

Sign in with Google

</button>

</div>
`;


Object.assign(
loginOverlay.style,
{

position:
"fixed",

inset:
"0",

background:
"#f8fafc",

display:
"flex",

alignItems:
"center",

justifyContent:
"center",

zIndex:
"99999"

}
);


document.body.appendChild(
loginOverlay
);



/* =========================
   GOOGLE LOGIN
========================= */

document
.getElementById(
"firebaseGoogleLogin"
)
.addEventListener(
"click",
async () => {

try{

await signInWithPopup(
auth,
provider
);

}

catch(error){

console.error(
error
);


alert(
"Google sign-in failed: " +
error.message
);

}

}
);



/* =========================
   AUTHENTICATION CHECK
========================= */

onAuthStateChanged(
auth,
user => {

if(user){

loginOverlay.style.display =
"none";


console.log(
"WakeSuite user:",
user.email
);


console.log(
"Firebase UID:",
user.uid
);


console.log(
"WakeSuite Firebase ready"
);

}

else{

loginOverlay.style.display =
"flex";

}

}
);



/* =========================
   FIRESTORE UPLOAD METADATA
========================= */

window.saveUploadMetadata =
async function(metadata){

const user =
auth.currentUser;


if(!user){

throw new Error(
"You must be signed in to WakeSuite."
);

}


const ref =
await addDoc(

collection(
db,
"uploads"
),

{

...metadata,


userId:
user.uid,


userEmail:
user.email || "",


uploadedAt:
serverTimestamp()

}

);


return ref.id;

};



/* =========================
   EXPOSE FIREBASE
========================= */

window.wakeSuiteFirebase = {

app,
auth,
db

};


</script>

</body>
</html>
