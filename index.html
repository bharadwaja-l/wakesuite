<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="
https://fonts.googleapis.com/css2?
family=Inter:wght@300;400;500;600;700
&display=swap"

rel="stylesheet">


<style>

/* ===================
GLOBAL
=================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:'Inter';

background:

linear-gradient(
135deg,
#f8fafc,
#eef2ff
);

color:#111827;

}


/* ===================
SIDEBAR
=================== */

.sidebar{

position:fixed;

left:0;
top:0;

width:260px;
height:100vh;

background:white;

padding:35px;

box-shadow:

2px 0 25px
rgba(0,0,0,.05);

}


.logo{

font-size:34px;
font-weight:700;

color:#2563eb;

margin-bottom:10px;

}


.tag{

color:gray;

margin-bottom:50px;

}


.menu{

padding:18px;

border-radius:14px;

background:#fff;

margin-bottom:12px;

cursor:pointer;

font-weight:600;

transition:.2s;

box-shadow:

0 3px 12px
rgba(0,0,0,.04);

}


.menu:hover{

background:#eff6ff;

transform:
translateX(6px);

}


.folder{

padding:14px;

margin:

8px
0
8px
25px;

background:

#f8fafc;

border-radius:10px;

font-size:14px;

}


/* ===================
MAIN
=================== */

.main{

margin-left:280px;

padding:40px;

}


.top{

display:flex;

justify-content:
space-between;

margin-bottom:40px;

}


.title{

font-size:40px;

font-weight:700;

}


.subtitle{

color:gray;

margin-top:10px;

}


.cards{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(
220px,
1fr
)

);

gap:20px;

margin-bottom:40px;

}


.card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:

0 8px 30px
rgba(0,0,0,.05);

}


.metric{

font-size:32px;

font-weight:700;

margin-top:15px;

}


/* ===================
STATUS
=================== */

.status{

background:white;

padding:30px;

border-radius:20px;

box-shadow:

0 8px 30px
rgba(0,0,0,.05);

margin-top:40px;

}


/* ===================
FOOTER
=================== */

.footer{

margin-top:50px;

color:gray;

font-size:13px;

}

</style>

</head>



<body>


<div class="sidebar">

<div class="logo">

WakeSuite

</div>

<div class="tag">

Marketplace Intelligence

</div>


<div id="sidebar">

Loading...

</div>

</div>



<div class="main">


<div class="top">

<div>

<div class="title">

Dashboard

</div>

<div class="subtitle">

Wakefit Marketplace Operations

</div>

</div>


<div>

24 May 2026

</div>

</div>



<div class="cards">

<div class="card">

Suppression

<div class="metric">

128

</div>

</div>


<div class="card">

Buy Box

<div class="metric">

42

</div>

</div>


<div class="card">

Price Alerts

<div class="metric">

18

</div>

</div>


<div class="card">

Reports

<div class="metric">

532

</div>

</div>

</div>



<div class="status">

<b>System Health</b>

<br><br>

Google Sheets → Connected

<br>

Apps Script → Active

<br>

GitHub → Live

<br>

WakeSuite → Running


</div>



<div class="footer">

WakeSuite © 2026

</div>


</div>

<div class="footer">

WakeSuite © 2026

</div>


</div>


<!-- ======================
UPLOAD CENTER
====================== -->

<h2>

Upload Report

</h2>


<input
type="date"
id="reportDate">

<br><br>


<select id="menu">

<option>
Wakefit
</option>

<option>
Amazon
</option>

<option>
Flipkart
</option>

</select>

<br><br>


<input
type="text"

placeholder="Folder"

id="folder">

<br><br>


<input
type="file"

id="file">

<br><br>


<button>

Upload

</button>



<script>


<script>

async function load(){

try{

let response=
await fetch(
"https://script.google.com/macros/s/AKfycbwe1CK3w2veuRPZdHDIo7LWHptdk5uU1UVJMjGlTtnqyHswEsZzeX3cfjuo2iyj3sQL/exec"
);

let data=
await response.json();

let menus=
data.menus.slice(1);

let folders=
data.folders.slice(1);

let html="";


menus.forEach(menu=>{

if(menu[1]){

html+=

`

<div
class="menu"

onclick="
toggle('${menu[0]}')
">

${menu[0]}

</div>


<div

id="${menu[0]}"

style="display:none">

`;


folders.forEach(folder=>{

if(

folder[0]===menu[0]
&& folder[2]

){

html+=

`

<div
class="folder">

📁 ${folder[1]}

</div>

`;

}

});


html+=
`</div>`;

}

});


document
.getElementById(
"sidebar"
)
.innerHTML=
html;

}


catch(e){

document
.getElementById(
"sidebar"
)
.innerHTML=
"Error";

}

}



function toggle(id){

let x=
document
.getElementById(id);

x.style.display=

x.style.display==="none"

?

"block"

:

"none";

}


load();

</script>


</body>

</html>
