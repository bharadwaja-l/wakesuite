<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
  rel="stylesheet"
>


<!-- SheetJS -->
<script
  src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
</script>


<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:linear-gradient(
    135deg,
    #f8fafc,
    #eef2ff
  );
  color:#111827;
}


/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:260px;
  height:100vh;
  background:white;
  padding:30px;
  box-shadow:2px 0 20px rgba(0,0,0,.05);
  overflow:auto;
}

.logo{
  font-size:34px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:10px;
}

.tag{
  color:gray;
  margin-bottom:40px;
}

.menu{
  padding:16px;
  background:white;
  margin-bottom:10px;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.folder{
  padding:12px;
  margin:8px 0 8px 25px;
  background:#f5f7fa;
  border-radius:10px;
}


/* MAIN */

.main{
  margin-left:280px;
  padding:40px;
}

.title{
  font-size:42px;
  font-weight:700;
}

.subtitle{
  color:gray;
  margin-bottom:40px;
}


/* CARDS */

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.metric{
  font-size:34px;
  font-weight:700;
  margin-top:10px;
}


/* PRICE DISPARITY */

#priceDisparitySection{
  display:none;
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:30px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}


/* UPLOAD */

.upload{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
  max-width:650px;
}

.upload h2{
  margin-bottom:20px;
}

.upload label{
  font-size:14px;
  font-weight:600;
}

.upload input,
.upload select{
  width:100%;
  padding:12px;
  margin:10px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:'Inter',Arial,sans-serif;
}

.upload button{
  padding:14px;
  width:100%;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-family:'Inter',Arial,sans-serif;
}

.upload button:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* STATUS */

.upload-status{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.upload-status.success{
  display:block;
  background:#ecfdf5;
  color:#065f46;
}

.upload-status.error{
  display:block;
  background:#fef2f2;
  color:#991b1b;
}


/* FILE INFO */

.file-info{
  display:none;
  margin-top:18px;
  padding:18px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
}

.file-info-title{
  font-weight:700;
  margin-bottom:10px;
}

.file-info-row{
  margin-top:7px;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

.validation-success{
  color:#047857;
  font-weight:600;
}

.validation-error{
  color:#b91c1c;
  font-weight:600;
}


/* FOOTER */

.footer{
  margin-top:40px;
  color:gray;
}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    WakeSuite
  </div>

  <div class="tag">
    Marketplace Intelligence
  </div>

  <div id="sidebar"></div>

</div>


<!-- MAIN -->

<div class="main">

  <div class="title">
    Dashboard
  </div>

  <div class="subtitle">
    Wakefit Marketplace Operations
  </div>


  <!-- CARDS -->

  <div class="cards">

    <div
      class="card"
      onclick="showPriceDisparity()"
      style="cursor:pointer;"
    >

      Price Disparity

      <div
        class="metric"
        id="priceDisparityCount"
      >
        0
      </div>

    </div>


    <div class="card">

      Buy Box

      <div class="metric">
        42
      </div>

    </div>


    <div class="card">

      Reports

      <div class="metric">
        532
      </div>

    </div>

  </div>


  <!-- PRICE DISPARITY -->

  <div id="priceDisparitySection">

    <h2>
      Price Disparity Details
    </h2>

    <table
      id="priceDisparityTable"
      style="
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
      "
    >
    </table>

  </div>


  <!-- UPLOAD -->

  <div class="upload">

    <h2>
      Upload Report
    </h2>


    <label>
      Report Date
    </label>

    <input
      type="date"
      id="reportDate"
    >


    <label>
      Menu
    </label>

    <select id="menu">

      <option value="">
        Loading...
      </option>

    </select>


    <label>
      Folder
    </label>

    <select id="folder">

      <option value="">
        Loading...
      </option>

    </select>


    <label>
      File
    </label>

    <input
      type="file"
      id="file"
      accept=".csv,.txt,.tsv,.xlsx,.xls"
    >


    <button
      id="uploadButton"
      onclick="uploadData()"
    >
      Upload
    </button>


    <div
      id="uploadStatus"
      class="upload-status"
    >
    </div>


    <div
      id="fileInfo"
      class="file-info"
    >

      <div class="file-info-title">
        Parsed Report
      </div>

      <div
        class="file-info-row"
        id="parsedFileName"
      ></div>

      <div
        class="file-info-row"
        id="parsedSheetName"
      ></div>

      <div
        class="file-info-row"
        id="parsedRowCount"
      ></div>

      <div
        class="file-info-row"
        id="parsedHeaders"
      ></div>

      <div
        class="file-info-row"
        id="detectedReport"
      ></div>

      <div
        class="file-info-row"
        id="validationResult"
      ></div>

    </div>

  </div>


  <div class="footer">
    WakeSuite © 2026
  </div>

</div>



<script>


/* ======================================================
   CURRENT CONFIG SOURCE

   Menu + Folder still come from Apps Script for now.
====================================================== */

const CONFIG_URL =
"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec";


let allFolders = [];



/* ======================================================
   REPORT DEFINITIONS
====================================================== */

const REPORT_DEFINITIONS = {


  wakefitDailyPricing: {

    id:
      "wakefit_daily_pricing",

    label:
      "Wakefit → Daily Pricing Sheet",

    requiredHeaders: [

      "scm_master_category",

      "item_sku",

      "mrp",

      "sale_price",

      "active"

    ]

  },


  amazonAllListings: {

    id:
      "amazon_all_listings",

    label:
      "Amazon → All Listings Report",

    requiredHeaders: [

      "seller-sku",

      "asin1",

      "item-name",

      "price",

      "quantity",

      "status",

      "minimum-seller-allowed-price",

      "maximum-seller-allowed-price",

      "expedited-shipping",

      "fulfillment-channel",

      "merchant-shipping-group",

      "maximum-retail-price"

    ]

  },


  amazonFbaInventory: {

    id:
      "amazon_fba_inventory",

    label:
      "Amazon → FBA Inventory",

    requiredHeaders: [

      "seller-sku",

      "fulfillment-channel-sku",

      "asin",

      "condition-type",

      "Warehouse-Condition-code",

      "Quantity Available"

    ]

  },


  amazonOrderReport: {

    id:
      "amazon_order_report",

    label:
      "Amazon → Order Report",

    /*
      We only require the columns
      needed for current Price Disparity logic.

      The report can contain many more columns.
    */

    requiredHeaders: [

      "purchase-date",

      "sku",

      "quantity-purchased"

    ]

  }


};



/* ======================================================
   LOAD CONFIG
====================================================== */

async function load(){


  try{


    const response =
      await fetch(
        CONFIG_URL
      );


    if(!response.ok){

      throw new Error(
        "Unable to load WakeSuite configuration."
      );

    }


    const data =
      await response.json();


    const uploads =
      data.uploads
      ?
      data.uploads.slice(1)
      :
      [];


    if(
      data.priceDisparity &&
      data.priceDisparity.length > 1
    ){

      document
      .getElementById(
        "priceDisparityCount"
      )
      .innerText =
        data.priceDisparity.length - 1;

    }


    allFolders =
      uploads;


    populateMenus(
      uploads
    );


    populateFolders();


  }
  catch(error){


    console.error(
      "WakeSuite config error:",
      error
    );


    document
    .getElementById(
      "sidebar"
    )
    .innerHTML =
      "Unable to load configuration.";


  }

}



/* ======================================================
   PRICE DISPARITY
====================================================== */

function showPriceDisparity(){


  const section =
    document
    .getElementById(
      "priceDisparitySection"
    );


  if(
    section.style.display ===
    "block"
  ){

    section.style.display =
      "none";

  }
  else{

    section.style.display =
      "block";

  }

}



/* ======================================================
   TOGGLE
====================================================== */

function toggle(id){


  const element =
    document
    .getElementById(
      id
    );


  element.style.display =
    element.style.display ===
    "none"
    ?
    "block"
    :
    "none";

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value){


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/* ======================================================
   POPULATE MENUS
====================================================== */

function populateMenus(uploads){


  let html = "";


  const seen =
    new Set();


  uploads.forEach(
    row => {


      const menu =
        row[0];


      const active =
        row[2];


      if(
        menu &&
        active &&
        !seen.has(menu)
      ){


        seen.add(
          menu
        );


        html +=
          `<option value="${escapeHtml(menu)}">${escapeHtml(menu)}</option>`;

      }


    }
  );


  if(!html){

    html =
      `<option value="">No menus available</option>`;

  }


  document
  .getElementById(
    "menu"
  )
  .innerHTML =
    html;

}



/* ======================================================
   POPULATE FOLDERS
====================================================== */

function populateFolders(){


  const selectedMenu =
    document
    .getElementById(
      "menu"
    )
    .value;


  let html =
    `<option value="">Select Folder</option>`;


  allFolders.forEach(
    row => {


      const menu =
        row[0];


      const folder =
        row[1];


      const active =
        row[2];


      if(
        menu === selectedMenu &&
        folder &&
        active
      ){


        html +=
          `<option value="${escapeHtml(folder)}">${escapeHtml(folder)}</option>`;

      }


    }
  );


  document
  .getElementById(
    "folder"
  )
  .innerHTML =
    html;

}



document
.getElementById(
  "menu"
)
.addEventListener(
  "change",
  populateFolders
);



/* ======================================================
   STATUS
====================================================== */

function setUploadStatus(
  message,
  type
){


  const element =
    document
    .getElementById(
      "uploadStatus"
    );


  element.className =
    "upload-status " +
    type;


  element.textContent =
    message;

}



/* ======================================================
   HEADER NORMALIZATION

   Makes these equivalent:

   seller-sku
   Seller SKU
   seller_sku
   SELLER-SKU
====================================================== */

function canonicalHeader(value){


  return String(
    value ?? ""
  )

  .replace(
    /^\uFEFF/,
    ""
  )

  .trim()

  .toLowerCase()

  .replace(
    /[^a-z0-9]/g,
    ""
  );

}



/* ======================================================
   ORIGINAL HEADER CLEANUP
====================================================== */

function cleanHeader(value){


  return String(
    value ?? ""
  )

  .replace(
    /^\uFEFF/,
    ""
  )

  .trim();

}



/* ======================================================
   NORMALIZE ROW HEADERS
====================================================== */

function normalizeRow(row){


  const cleaned = {};


  Object.entries(
    row
  )
  .forEach(
    ([key,value]) => {


      const cleanKey =
        cleanHeader(
          key
        );


      cleaned[
        cleanKey
      ] =
        value;


    }
  );


  return cleaned;

}



/* ======================================================
   CHECK IF HEADERS MATCH REPORT
====================================================== */

function reportMatchesHeaders(
  headers,
  definition
){


  const available =
    new Set(
      headers.map(
        canonicalHeader
      )
    );


  const missing =
    definition
    .requiredHeaders
    .filter(
      requiredHeader =>

        !available.has(
          canonicalHeader(
            requiredHeader
          )
        )

    );


  return {

    matches:
      missing.length === 0,

    missingHeaders:
      missing

  };

}



/* ======================================================
   AUTO-DETECT REPORT FROM FILE HEADERS
====================================================== */

function detectReport(headers){


  const definitions =
    Object.values(
      REPORT_DEFINITIONS
    );


  for(
    const definition
    of definitions
  ){


    const check =
      reportMatchesHeaders(
        headers,
        definition
      );


    if(
      check.matches
    ){

      return definition;

    }

  }


  return null;

}



/* ======================================================
   FIND EXPECTED REPORT FROM MENU + FOLDER
====================================================== */

function getSelectedReportDefinition(
  menu,
  folder
){


  const normalizedMenu =
    String(
      menu || ""
    )
    .trim()
    .toLowerCase();


  const normalizedFolder =
    String(
      folder || ""
    )
    .trim()
    .toLowerCase();



  /* WAKEFIT DAILY PRICING */

  if(
    normalizedMenu.includes(
      "wakefit"
    )
    &&
    normalizedFolder.includes(
      "daily"
    )
    &&
    normalizedFolder.includes(
      "pricing"
    )
  ){

    return REPORT_DEFINITIONS
      .wakefitDailyPricing;

  }



  /* AMAZON ALL LISTINGS */

  if(
    normalizedMenu.includes(
      "amazon"
    )
    &&
    normalizedFolder.includes(
      "all"
    )
    &&
    normalizedFolder.includes(
      "listing"
    )
  ){

    return REPORT_DEFINITIONS
      .amazonAllListings;

  }



  /* AMAZON FBA INVENTORY */

  if(
    normalizedMenu.includes(
      "amazon"
    )
    &&
    normalizedFolder.includes(
      "fba"
    )
    &&
    normalizedFolder.includes(
      "inventory"
    )
  ){

    return REPORT_DEFINITIONS
      .amazonFbaInventory;

  }



  /* AMAZON ORDER REPORT */

  if(
    normalizedMenu.includes(
      "amazon"
    )
    &&
    normalizedFolder.includes(
      "order"
    )
  ){

    return REPORT_DEFINITIONS
      .amazonOrderReport;

  }



  return null;

}



/* ======================================================
   VALIDATE SELECTED REPORT AGAINST FILE
====================================================== */

function validateSelectedReport(
  menu,
  folder,
  headers
){


  const selectedDefinition =
    getSelectedReportDefinition(
      menu,
      folder
    );


  const detectedDefinition =
    detectReport(
      headers
    );



  if(
    !selectedDefinition
  ){

    return {

      valid:false,

      selectedLabel:
        menu +
        " → " +
        folder,

      detectedLabel:
        detectedDefinition
        ?
        detectedDefinition.label
        :
        "Unknown report",

      missingHeaders:[],

      message:
        "Validation has not yet been configured for this report type."

    };

  }



  const check =
    reportMatchesHeaders(
      headers,
      selectedDefinition
    );



  if(
    check.matches
  ){

    return {

      valid:true,

      selectedLabel:
        selectedDefinition.label,

      detectedLabel:
        detectedDefinition
        ?
        detectedDefinition.label
        :
        selectedDefinition.label,

      detectedId:
        detectedDefinition
        ?
        detectedDefinition.id
        :
        selectedDefinition.id,

      missingHeaders:[],

      message:
        "Report validation passed."

    };

  }



  return {

    valid:false,

    selectedLabel:
      selectedDefinition.label,

    detectedLabel:
      detectedDefinition
      ?
      detectedDefinition.label
      :
      "Unknown report",

    detectedId:
      detectedDefinition
      ?
      detectedDefinition.id
      :
      null,

    missingHeaders:
      check.missingHeaders,

    message:
      "The selected report type does not match the uploaded file."

  };

}



/* ======================================================
   SHOW PARSED FILE INFO
====================================================== */

function showParsedFileInfo(
  parsedFile,
  validation
){


  const box =
    document
    .getElementById(
      "fileInfo"
    );


  box.style.display =
    "block";


  document
  .getElementById(
    "parsedFileName"
  )
  .textContent =
    "File: " +
    parsedFile.fileName;


  document
  .getElementById(
    "parsedSheetName"
  )
  .textContent =
    "Sheet: " +
    parsedFile.sheetName;


  document
  .getElementById(
    "parsedRowCount"
  )
  .textContent =
    "Rows: " +
    parsedFile.rowCount;


  document
  .getElementById(
    "parsedHeaders"
  )
  .textContent =
    "Columns: " +
    parsedFile.headers.join(
      ", "
    );


  document
  .getElementById(
    "detectedReport"
  )
  .textContent =
    "Detected report: " +
    validation.detectedLabel;



  const validationElement =
    document
    .getElementById(
      "validationResult"
    );


  if(
    validation.valid
  ){


    validationElement.className =
      "file-info-row validation-success";


    validationElement.textContent =
      "✓ Validation passed";


  }
  else{


    validationElement.className =
      "file-info-row validation-error";


    validationElement.textContent =
      "✕ Validation failed";


  }

}



/* ======================================================
   READ FILE
====================================================== */

async function readWakeSuiteFile(file){


  if(!file){

    throw new Error(
      "No file selected."
    );

  }


  if(
    typeof XLSX ===
    "undefined"
  ){

    throw new Error(
      "Spreadsheet reader is not loaded."
    );

  }


  console.log(
    "Reading file:",
    file.name
  );


  const buffer =
    await file.arrayBuffer();


  let workbook;


  try{


    workbook =
      XLSX.read(
        buffer,
        {
          type:"array",
          cellDates:false
        }
      );


  }
  catch(error){


    console.error(
      "File parsing error:",
      error
    );


    throw new Error(
      "WakeSuite could not read this file."
    );

  }


  if(
    !workbook.SheetNames ||
    workbook.SheetNames.length === 0
  ){

    throw new Error(
      "No worksheet or data was found."
    );

  }


  const firstSheetName =
    workbook.SheetNames[0];


  const worksheet =
    workbook.Sheets[
      firstSheetName
    ];


  let rows =
    XLSX.utils.sheet_to_json(
      worksheet,
      {
        defval:"",
        raw:false,
        blankrows:false
      }
    );


  rows =
    rows.map(
      normalizeRow
    );


  rows =
    rows.filter(
      row =>

        Object.values(
          row
        )
        .some(
          value =>

            String(
              value ?? ""
            )
            .trim() !== ""

        )
    );


  const headers =
    rows.length > 0
    ?
    Object.keys(
      rows[0]
    )
    .map(
      cleanHeader
    )
    :
    [];


  console.log(
    "Sheet:",
    firstSheetName
  );


  console.log(
    "Headers:",
    headers
  );


  console.log(
    "Total rows:",
    rows.length
  );


  console.log(
    "First 3 rows:",
    rows.slice(
      0,
      3
    )
  );


  return {

    fileName:
      file.name,

    fileSize:
      file.size,

    mimeType:
      file.type ||
      "unknown",

    sheetName:
      firstSheetName,

    headers:
      headers,

    rowCount:
      rows.length,

    rows:
      rows

  };

}



/* ======================================================
   UPLOAD + VALIDATION
====================================================== */

async function uploadData(){


  const reportDate =
    document
    .getElementById(
      "reportDate"
    )
    .value;


  const menu =
    document
    .getElementById(
      "menu"
    )
    .value;


  const folder =
    document
    .getElementById(
      "folder"
    )
    .value;


  const file =
    document
    .getElementById(
      "file"
    )
    .files[0];


  const uploadButton =
    document
    .getElementById(
      "uploadButton"
    );



  /* VALIDATION */

  if(!reportDate){

    alert(
      "Please select Report Date."
    );

    return;

  }


  if(!menu){

    alert(
      "Please select Menu."
    );

    return;

  }


  if(!folder){

    alert(
      "Please select Folder."
    );

    return;

  }


  if(!file){

    alert(
      "Please choose a file."
    );

    return;

  }


  if(
    typeof
    window.saveUploadMetadata
    !==
    "function"
  ){

    alert(
      "Firebase is not ready. Please refresh WakeSuite."
    );

    return;

  }


  try{


    uploadButton.disabled =
      true;


    uploadButton.innerText =
      "Reading report...";


    setUploadStatus(
      "Reading and validating report...",
      "success"
    );



    /* READ FILE */

    const parsedFile =
      await readWakeSuiteFile(
        file
      );


    window.currentWakeSuiteFile =
      file;


    window.currentWakeSuiteParsed =
      parsedFile;



    /* VALIDATE REPORT */

    const validation =
      validateSelectedReport(
        menu,
        folder,
        parsedFile.headers
      );


    console.log(
      "Validation:",
      validation
    );


    showParsedFileInfo(
      parsedFile,
      validation
    );



    /* STOP IF WRONG FILE */

    if(
      !validation.valid
    ){


      let message =

        "Wrong report selected.\n\n" +

        "You selected:\n" +
        validation.selectedLabel +

        "\n\nWakeSuite detected:\n" +
        validation.detectedLabel;


      if(
        validation.missingHeaders &&
        validation.missingHeaders.length > 0
      ){


        message +=

          "\n\nMissing expected columns:\n" +

          validation
          .missingHeaders
          .join(
            ", "
          );

      }


      message +=

        "\n\nNothing has been saved to Firestore.";


      setUploadStatus(
        "Validation failed. The report was not registered.",
        "error"
      );


      alert(
        message
      );


      console.warn(
        "Upload blocked due to report mismatch."
      );


      return;

    }



    /* VALID REPORT */

    setUploadStatus(
      "Report validated successfully. Registering...",
      "success"
    );


    uploadButton.innerText =
      "Registering...";



    const metadata = {


      reportDate:
        reportDate,


      menu:
        menu,


      reportType:
        folder,


      detectedReport:
        validation.detectedLabel,


      detectedReportId:
        validation.detectedId,


      validationStatus:
        "Valid",


      fileName:
        file.name,


      fileSize:
        file.size,


      mimeType:
        file.type ||
        "unknown",


      lastModified:
        file.lastModified,


      sheetName:
        parsedFile.sheetName,


      rowCount:
        parsedFile.rowCount,


      headers:
        parsedFile.headers,


      status:
        "Ready for processing",


      processed:
        false,


      rawFileStored:
        false


    };



    const uploadId =
      await window
      .saveUploadMetadata(
        metadata
      );



    window.currentWakeSuiteUpload = {


      uploadId:
        uploadId,


      reportDate:
        reportDate,


      menu:
        menu,


      reportType:
        folder,


      detectedReport:
        validation.detectedLabel,


      file:
        file,


      parsedFile:
        parsedFile


    };



    console.log(
      "WakeSuite upload registered:",
      uploadId
    );


    console.log(
      "Validated report:",
      validation.detectedLabel
    );


    setUploadStatus(

      "Validation passed. " +
      parsedFile.rowCount +
      " rows detected. Ready for processing.",

      "success"

    );


    alert(

      "Report validated and registered successfully.\n\n" +

      "Report: " +
      validation.detectedLabel +

      "\n\nFile: " +
      file.name +

      "\n\nRows detected: " +
      parsedFile.rowCount +

      "\n\nColumns detected: " +
      parsedFile.headers.length +

      "\n\nThe raw file has NOT been uploaded to cloud storage."

    );


  }
  catch(error){


    console.error(
      "WakeSuite upload error:",
      error
    );


    setUploadStatus(
      "Unable to process report: " +
      error.message,
      "error"
    );


    alert(
      "Unable to process report.\n\n" +
      error.message
    );


  }
  finally{


    uploadButton.disabled =
      false;


    uploadButton.innerText =
      "Upload";

  }

}



load();


</script>

window.saveUploadMetadata =
async function(metadata){


  const user =
    auth.currentUser;


  if(!user){


    throw new Error(
      "You must be signed in to WakeSuite."
    );


  }


  const documentReference =
    await addDoc(


      collection(
        db,
        "uploads"
      ),


      {


        ...metadata,


        userId:
          user.uid,


        userEmail:
          user.email ||
          "",


        uploadedAt:
          serverTimestamp()


      }


    );


  return documentReference.id;

};
