<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<style>

body{
font-family:Arial;
padding:30px;
}

button{

width:250px;
padding:12px;
margin:5px;

}

.folder{

margin-left:40px;

}

</style>

</head>

<body>

<h1>WakeSuite</h1>

<div id="content">

Loading...

</div>

<script>

async function loadData(){

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbzUMoC3QQAjUAQHC4kSKWsduPq4wU6O0ykdW--U-zONYDqDhM0hvwHpIWxAMC6PL-1x/exec"
);

let data =
await response.json();

let html="";

let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

menus.forEach(m=>{

if(m[1]){

html +=
`<button
onclick="toggleFolder('${m[0]}')">

${m[0]}

</button>

<div
id="${m[0]}"
style="display:none">

`;

folders.forEach(f=>{

if(
f[0]==m[0]
&& f[2]
){

html +=
`
<div class='folder'>

• ${f[1]}

</div>
`;

}

});

html +=
`</div>`;

}

});

document
.getElementById(
"content"
)
.innerHTML =
html;

}

function toggleFolder(id){

let x =
document
.getElementById(id);

x.style.display =
x.style.display=="none"
?
"block"
:
"none";

}

loadData();

</script>

</body>
</html>
