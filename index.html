<!DOCTYPE html>
<html>
<head>

<title>WakeSuite</title>

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter';
background:
linear-gradient(
135deg,
#f8fafc,
#eef2ff
);
color:#111827;
}

/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:white;
padding:30px;
box-shadow:
2px 0 20px rgba(0,0,0,.05);
overflow:auto;
}

.logo{
font-size:34px;
font-weight:700;
color:#2563eb;
margin-bottom:10px;
}

.tag{
color:gray;
margin-bottom:40px;
}

.menu{
padding:16px;
background:white;
margin-bottom:10px;
border-radius:14px;
cursor:pointer;
font-weight:600;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.folder{
padding:12px;
margin:
8px 0 8px 25px;
background:#f5f7fa;
border-radius:10px;
}

/* MAIN */

.main{
margin-left:280px;
padding:40px;
}

.title{
font-size:42px;
font-weight:700;
}

.subtitle{
color:gray;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:
0 6px 20px rgba(0,0,0,.05);
}

.metric{
font-size:34px;
font-weight:700;
margin-top:10px;
}

.upload{
background:white;
padding:30px;
border-radius:20px;
box-shadow:
0 6px 20px rgba(0,0,0,.05);
max-width:650px;
}

.upload input,
.upload select{

width:100%;
padding:12px;
margin:10px 0 20px;
border:1px solid #ddd;
border-radius:10px;

}

.upload button{

padding:14px;
width:100%;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;

}

.footer{
margin-top:40px;
color:gray;
}

</style>
</head>


<body>

<div class="sidebar">

<div class="logo">
WakeSuite
</div>

<div class="tag">
Marketplace Intelligence
</div>

<div id="sidebar">
</div>

</div>



<div class="main">

<div class="title">
Dashboard
</div>

<div class="subtitle">
Wakefit Marketplace Operations
</div>



<div class="cards">
<div class="card" onclick="showPriceDisparity()">
Price Disparity
<div class="metric" id="priceDisparityCount">
0
</div>
</div>

<div class="card">
Buy Box
<div class="metric">
42
</div>
</div>

<div class="card">
Reports
<div class="metric">
532
</div>
</div>

</div>
<div
id="priceDisparitySection"
style="
display:none;
background:white;
padding:20px;
border-radius:18px;
margin-top:20px;
box-shadow:0 6px 20px rgba(0,0,0,.05);
">

<h2>
Price Disparity Details
</h2>

<table
id="priceDisparityTable"
style="
width:100%;
border-collapse:collapse;
margin-top:15px;
">
</table>

</div>
<div class="upload">

<h2>
Upload Report
</h2>


<label>
Report Date
</label>

<input
type="date"
id="reportDate">


<label>
Menu
</label>

<select id="menu">
<option>
Loading...
</option>
</select>



<label>
Folder
</label>

<select id="folder">
<option>
Loading...
</option>
</select>



<label>
File
</label>

<input
type="file"
id="file">


<button
onclick="uploadData()">

Upload

</button>

</div>



<div class="footer">

WakeSuite © 2026

</div>

</div>



<script>

let allFolders=[];


/* LOAD CONFIG */

async function load(){

try{

let response =
await fetch(

"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec"

);

let data =
await response.json();
  
let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

let uploads =
data.uploads.slice(1);

if(
data.priceDisparity &&
data.priceDisparity.length > 1
){

document.getElementById(
"priceDisparityCount"
).innerText =

data.priceDisparity.length - 1;

}

allFolders =
uploads;

populateMenus(
uploads
);

populateFolders();

}

catch(err){

console.error(err);

document
.getElementById(
"sidebar"
)
.innerHTML =
err.toString();

}

}

function showPriceDisparity(){

let section =
document.getElementById(
"priceDisparitySection"
);

if(
section.style.display ===
"none"
){

section.style.display =
"block";

}
else{

section.style.display =
"none";

}

}

/* TOGGLE */

function toggle(id){

let x=
document
.getElementById(id);

x.style.display=

x.style.display==="none"

?

"block"

:

"none";

}



/* MENU */

function populateMenus(uploads){

let html="";
let seen=[];


uploads.forEach(u=>{

if(

u[2]

&& !seen.includes(
u[0]
)

){

seen.push(
u[0]
);

html +=

`
<option>

${u[0]}

</option>
`;

}

});


document
.getElementById(
"menu"
)
.innerHTML=
html;

}



/* FOLDERS */

function populateFolders(){

let menu=

document
.getElementById(
"menu"
)
.value;


let html=
"<option>Select Folder</option>";


allFolders.forEach(f=>{

if(

f[0]===menu
&& f[2]

){

html +=

`
<option>

${f[1]}

</option>
`;

}

});


document
.getElementById(
"folder"
)
.innerHTML=
html;

}


document
.getElementById(
"menu"
)
.addEventListener(
"change",
populateFolders
);




/* UPLOAD */

async function uploadData(){

let reportDate =
document.getElementById(
"reportDate"
).value;


let menu =
document.getElementById(
"menu"
).value;


let folder =
document.getElementById(
"folder"
).value;


let file =
document.getElementById(
"file"
).files[0];


if(!file){

alert(
"Choose file"
);

return;

}


let reader =
new FileReader();


reader.onload =
async function(){

let base64 =

reader.result
.split(",")[1];


let body={

reportDate,

menu,

folder,

fileName:
file.name,

mimeType:
file.type,

file:
base64

};


let response=

await fetch(

"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec",

{

method:"POST",

body:
JSON.stringify(
body
)

}

);


let result=
await response.json();


if(

result.status==="success"

){

alert(
"Uploaded"
);

}

else{

alert(

"Upload Failed\n\n"

+ result.message

);

}

};


reader.readAsDataURL(
file
);

}



load();

</script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAwOkR3aemcexscDptHVnRjxSQx3XmjuV4",
  authDomain: "wakesuite-4daf9.firebaseapp.com",
  projectId: "wakesuite-4daf9",
  storageBucket: "wakesuite-4daf9.firebasestorage.app",
  messagingSenderId: "34563161502",
  appId: "1:34563161502:web:9f0e9bc1e2da2d423d2a8f",
  measurementId: "G-VH7V68BSKD"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const provider =
  new GoogleAuthProvider();


const loginOverlay =
  document.createElement("div");

loginOverlay.id =
  "firebaseLoginOverlay";

loginOverlay.innerHTML = `
  <div style="
      background:white;
      width:380px;
      max-width:90%;
      padding:40px;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.15);
      text-align:center;
      font-family:Inter,Arial,sans-serif;
  ">

    <div style="
      font-size:34px;
      font-weight:700;
      color:#2563eb;
      margin-bottom:8px;
    ">
      WakeSuite
    </div>

    <div style="
      color:#6b7280;
      margin-bottom:30px;
    ">
      Marketplace Intelligence
    </div>

    <button
      id="firebaseGoogleLogin"
      style="
        width:100%;
        padding:14px;
        border:0;
        border-radius:10px;
        background:#2563eb;
        color:white;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
      "
    >
      Sign in with Google
    </button>

  </div>
`;


Object.assign(
  loginOverlay.style,
  {
    position:"fixed",
    inset:"0",
    background:"#f8fafc",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    zIndex:"99999"
  }
);


document.body.appendChild(
  loginOverlay
);


document
.getElementById(
  "firebaseGoogleLogin"
)
.addEventListener(
  "click",
  async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    }
    catch(error){

      console.error(error);

      alert(
        "Google sign-in failed: "
        + error.message
      );

    }

  }
);


onAuthStateChanged(
  auth,
  async user => {

    if(user){

      loginOverlay.style.display =
        "none";

      console.log(
        "WakeSuite user:",
        user.email
      );

      console.log(
        "Firebase UID:",
        user.uid
      );

      try {

        await setDoc(
          doc(
            db,
            "system",
            "connection-test"
          ),
          {
            status:
              "WakeSuite Connected",

            updatedAt:
              serverTimestamp()
          },
          {
            merge: true
          }
        );

        console.log(
          "Firestore connection successful"
        );

      }
      catch(error){

        console.error(
          "Firestore connection failed:",
          error
        );

      }

    }
    else{

      loginOverlay.style.display =
        "flex";

    }

  }
);
</script>
