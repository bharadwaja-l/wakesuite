<script>


/* ======================================================
   EXISTING CONFIG SOURCE

   FOR NOW:
   Menu + Folder configuration still comes
   from your existing Apps Script.

   We will migrate this later.
====================================================== */

const CONFIG_URL =

"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec";



let allFolders = [];



/* ======================================================
   LOAD CONFIGURATION
====================================================== */

async function load(){


  try{


    const response =

      await fetch(
        CONFIG_URL
      );



    if(
      !response.ok
    ){

      throw new Error(
        "Unable to load WakeSuite configuration."
      );

    }



    const data =

      await response.json();



    const uploads =

      data.uploads
      ?
      data.uploads.slice(1)
      :
      [];



    /*
      Existing Price Disparity count
      from current Apps Script source.

      We will replace this with Firestore
      later.
    */

    if(

      data.priceDisparity &&

      data.priceDisparity.length > 1

    ){

      document
      .getElementById(
        "priceDisparityCount"
      )
      .innerText =

        data.priceDisparity.length - 1;

    }



    allFolders =

      uploads;



    populateMenus(
      uploads
    );



    populateFolders();


  }


  catch(error){


    console.error(
      "WakeSuite config error:",
      error
    );


    document
    .getElementById(
      "sidebar"
    )
    .innerHTML =

      "Unable to load configuration.";


  }


}



/* ======================================================
   SHOW / HIDE PRICE DISPARITY
====================================================== */

function showPriceDisparity(){


  const section =

    document
    .getElementById(
      "priceDisparitySection"
    );



  if(

    section.style.display ===
    "block"

  ){

    section.style.display =

      "none";

  }


  else{

    section.style.display =

      "block";

  }


}



/* ======================================================
   GENERIC TOGGLE
====================================================== */

function toggle(id){


  const element =

    document
    .getElementById(
      id
    );


  element.style.display =

    element.style.display ===
    "none"

    ?

    "block"

    :

    "none";


}



/* ======================================================
   SAFE HTML
====================================================== */

function escapeHtml(value){


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );


}



/* ======================================================
   POPULATE MENU
====================================================== */

function populateMenus(uploads){


  let html = "";


  const seen =

    new Set();



  uploads.forEach(

    row => {


      const menu =

        row[0];


      const active =

        row[2];



      if(

        menu &&

        active &&

        !seen.has(menu)

      ){


        seen.add(
          menu
        );


        html +=

          `<option value="${escapeHtml(menu)}">${escapeHtml(menu)}</option>`;


      }


    }

  );



  if(
    !html
  ){

    html =

      `<option value="">No menus available</option>`;

  }



  document
  .getElementById(
    "menu"
  )
  .innerHTML =

    html;


}



/* ======================================================
   POPULATE FOLDERS
====================================================== */

function populateFolders(){


  const selectedMenu =

    document
    .getElementById(
      "menu"
    )
    .value;



  let html =

    `<option value="">Select Folder</option>`;



  allFolders.forEach(

    row => {


      const menu =

        row[0];


      const folder =

        row[1];


      const active =

        row[2];



      if(

        menu ===
        selectedMenu &&

        folder &&

        active

      ){


        html +=

          `<option value="${escapeHtml(folder)}">${escapeHtml(folder)}</option>`;


      }


    }

  );



  document
  .getElementById(
    "folder"
  )
  .innerHTML =

    html;


}



document
.getElementById(
  "menu"
)
.addEventListener(
  "change",
  populateFolders
);



/* ======================================================
   UPLOAD STATUS
====================================================== */

function setUploadStatus(
  message,
  type
){


  const element =

    document
    .getElementById(
      "uploadStatus"
    );


  element.className =

    "upload-status " +
    type;


  element.textContent =

    message;


}



/* ======================================================
   SHOW PARSED FILE DETAILS
====================================================== */

function showParsedFileInfo(
  parsedFile
){


  const box =

    document
    .getElementById(
      "fileInfo"
    );


  box.style.display =

    "block";



  document
  .getElementById(
    "parsedFileName"
  )
  .textContent =

    "File: " +
    parsedFile.fileName;



  document
  .getElementById(
    "parsedSheetName"
  )
  .textContent =

    "Sheet: " +
    parsedFile.sheetName;



  document
  .getElementById(
    "parsedRowCount"
  )
  .textContent =

    "Rows: " +
    parsedFile.rowCount;



  document
  .getElementById(
    "parsedHeaders"
  )
  .textContent =

    "Columns: " +
    parsedFile.headers.join(
      ", "
    );


}



/* ======================================================
   NORMALIZE HEADER
====================================================== */

function normalizeHeader(value){


  return String(
    value ?? ""
  )

  .replace(
    /^\uFEFF/,
    ""
  )

  .trim();


}



/* ======================================================
   NORMALIZE ROW HEADERS
====================================================== */

function normalizeRow(row){


  const cleaned = {};


  Object.entries(
    row
  )
  .forEach(

    ([key,value]) => {


      const cleanKey =

        normalizeHeader(
          key
        );


      cleaned[
        cleanKey
      ] =

        value;


    }

  );


  return cleaned;


}



/* ======================================================
   READ CSV / TXT / TSV / XLSX / XLS

   EVERYTHING HAPPENS INSIDE THE BROWSER.
====================================================== */

async function readWakeSuiteFile(file){


  if(
    !file
  ){

    throw new Error(
      "No file selected."
    );

  }



  if(

    typeof XLSX ===
    "undefined"

  ){

    throw new Error(
      "Spreadsheet reader is not loaded."
    );

  }



  console.log(
    "Reading file:",
    file.name
  );



  const buffer =

    await file.arrayBuffer();



  let workbook;



  try{


    workbook =

      XLSX.read(

        buffer,

        {

          type:
            "array",

          cellDates:
            false

        }

      );


  }


  catch(error){


    console.error(
      "File parsing error:",
      error
    );


    throw new Error(
      "WakeSuite could not read this file."
    );


  }



  if(

    !workbook.SheetNames ||

    workbook.SheetNames.length === 0

  ){

    throw new Error(
      "No worksheet or data was found in this file."
    );

  }



  const firstSheetName =

    workbook.SheetNames[0];



  const worksheet =

    workbook.Sheets[
      firstSheetName
    ];



  let rows =

    XLSX.utils.sheet_to_json(

      worksheet,

      {

        defval:"",

        raw:false,

        blankrows:false

      }

    );



  rows =

    rows.map(
      normalizeRow
    );



  /*
    Remove completely blank rows.
  */

  rows =

    rows.filter(

      row =>

        Object.values(
          row
        )
        .some(

          value =>

            String(
              value ?? ""
            )
            .trim() !== ""

        )

    );



  let headers = [];



  if(
    rows.length > 0
  ){


    headers =

      Object.keys(
        rows[0]
      )
      .map(
        normalizeHeader
      );


  }



  console.log(
    "Sheet:",
    firstSheetName
  );


  console.log(
    "Headers:",
    headers
  );


  console.log(
    "Total rows:",
    rows.length
  );


  console.log(
    "First 3 rows:",
    rows.slice(
      0,
      3
    )
  );



  return {


    fileName:
      file.name,


    fileSize:
      file.size,


    mimeType:
      file.type ||
      "unknown",


    sheetName:
      firstSheetName,


    headers:
      headers,


    rowCount:
      rows.length,


    rows:
      rows


  };


}



/* ======================================================
   UPLOAD REPORT

   NEW FLOW:

   File
     ↓
   Browser
     ↓
   Parse report
     ↓
   Firestore metadata

   RAW FILE IS NOT STORED IN CLOUD.
====================================================== */

async function uploadData(){


  const reportDate =

    document
    .getElementById(
      "reportDate"
    )
    .value;



  const menu =

    document
    .getElementById(
      "menu"
    )
    .value;



  const folder =

    document
    .getElementById(
      "folder"
    )
    .value;



  const fileInput =

    document
    .getElementById(
      "file"
    );



  const file =

    fileInput.files[0];



  const uploadButton =

    document
    .getElementById(
      "uploadButton"
    );



  /* ====================================================
     VALIDATION
  ==================================================== */

  if(
    !reportDate
  ){

    alert(
      "Please select Report Date."
    );

    return;

  }



  if(
    !menu
  ){

    alert(
      "Please select Menu."
    );

    return;

  }



  if(
    !folder
  ){

    alert(
      "Please select Folder."
    );

    return;

  }



  if(
    !file
  ){

    alert(
      "Please choose a file."
    );

    return;

  }



  if(

    typeof
    window.saveUploadMetadata
    !==
    "function"

  ){

    alert(
      "Firebase is not ready yet. Please refresh WakeSuite and try again."
    );

    return;

  }



  try{


    uploadButton.disabled =

      true;


    uploadButton.innerText =

      "Reading report...";



    setUploadStatus(

      "Reading and validating report...",

      "success"

    );



    /* ==================================================
       KEEP RAW FILE IN CURRENT BROWSER SESSION
    ================================================== */

    window.currentWakeSuiteFile =

      file;



    /* ==================================================
       READ FILE
    ================================================== */

    const parsedFile =

      await readWakeSuiteFile(
        file
      );



    window.currentWakeSuiteParsed =

      parsedFile;



    console.log(
      "WakeSuite parsed successfully"
    );


    console.log(
      "Row count:",
      parsedFile.rowCount
    );


    console.log(
      "Columns:",
      parsedFile.headers
    );



    /* ==================================================
       SHOW PARSED INFORMATION ON WEBSITE
    ================================================== */

    showParsedFileInfo(
      parsedFile
    );



    /* ==================================================
       METADATA FOR FIRESTORE
    ================================================== */

    const metadata = {


      reportDate:
        reportDate,


      menu:
        menu,


      reportType:
        folder,


      fileName:
        file.name,


      fileSize:
        file.size,


      mimeType:
        file.type ||
        "unknown",


      lastModified:
        file.lastModified,


      sheetName:
        parsedFile.sheetName,


      rowCount:
        parsedFile.rowCount,


      headers:
        parsedFile.headers,


      status:
        "Ready for processing",


      processed:
        false,


      rawFileStored:
        false


    };



    uploadButton.innerText =

      "Registering...";



    /* ==================================================
       SAVE METADATA TO FIRESTORE
    ================================================== */

    const uploadId =

      await window
      .saveUploadMetadata(
        metadata
      );



    /* ==================================================
       KEEP CURRENT REPORT INFORMATION IN MEMORY
    ================================================== */

    window.currentWakeSuiteUpload = {


      uploadId:
        uploadId,


      reportDate:
        reportDate,


      menu:
        menu,


      reportType:
        folder,


      file:
        file,


      parsedFile:
        parsedFile


    };



    console.log(
      "WakeSuite upload registered:",
      uploadId
    );


    console.log(
      "Selected report:",
      menu,
      folder
    );



    setUploadStatus(

      "Report read successfully. " +
      parsedFile.rowCount +
      " rows detected. Ready for processing.",

      "success"

    );



    alert(

      "Report registered successfully.\n\n" +

      "File: " +
      file.name +

      "\n\nRows detected: " +
      parsedFile.rowCount +

      "\n\nColumns detected: " +
      parsedFile.headers.length +

      "\n\nThe raw file has NOT been uploaded to cloud storage."

    );


  }


  catch(error){


    console.error(
      "WakeSuite upload error:",
      error
    );



    setUploadStatus(

      "Unable to read/register report: " +
      error.message,

      "error"

    );



    alert(

      "Unable to read/register report.\n\n" +
      error.message

    );


  }


  finally{


    uploadButton.disabled =

      false;


    uploadButton.innerText =

      "Upload";


  }


}



/* ======================================================
   START WAKESUITE
====================================================== */

load();


</script>

    Sign in with Google

  </button>


</div>

`;



Object.assign(

  loginOverlay.style,

  {


    position:
      "fixed",


    inset:
      "0",


    background:
      "#f8fafc",


    display:
      "flex",


    alignItems:
      "center",


    justifyContent:
      "center",


    zIndex:
      "99999"


  }

);



document.body.appendChild(
  loginOverlay
);



/* ======================================================
   GOOGLE LOGIN
====================================================== */

document
.getElementById(
  "firebaseGoogleLogin"
)
.addEventListener(

  "click",

  async () => {


    try{


      await signInWithPopup(
        auth,
        provider
      );


    }


    catch(error){


      console.error(
        "Google sign-in error:",
        error
      );


      alert(

        "Google sign-in failed: " +
        error.message

      );


    }


  }

);



/* ======================================================
   AUTHENTICATION CHECK
====================================================== */

onAuthStateChanged(

  auth,

  user => {


    if(
      user
    ){


      loginOverlay.style.display =

        "none";



      console.log(

        "WakeSuite user:",

        user.email

      );



      console.log(

        "Firebase UID:",

        user.uid

      );



      console.log(

        "WakeSuite Firebase ready"

      );


    }


    else{


      loginOverlay.style.display =

        "flex";


    }


  }

);



/* ======================================================
   SAVE UPLOAD METADATA TO FIRESTORE
====================================================== */

window.saveUploadMetadata =

async function(metadata){


  const user =

    auth.currentUser;



  if(
    !user
  ){

    throw new Error(

      "You must be signed in to WakeSuite."

    );

  }



  const documentReference =

    await addDoc(


      collection(
        db,
        "uploads"
      ),


      {


        ...metadata,


        userId:
          user.uid,


        userEmail:
          user.email || "",


        uploadedAt:
          serverTimestamp()


      }


    );



  return documentReference.id;


};



/* ======================================================
   MAKE FIREBASE AVAILABLE TO WAKESUITE
====================================================== */

window.wakeSuiteFirebase = {


  app:
    app,


  auth:
    auth,


  db:
    db


};


</script>
