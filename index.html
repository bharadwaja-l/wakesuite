<!DOCTYPE html>
<html>

<head>

<title>WakeSuite</title>

<style>

/* ==========================
   GLOBAL
========================== */

body{

margin:0;
font-family:
"Segoe UI",
Arial;

background:#f5f7fa;

}


/* ==========================
   HEADER
========================== */

.header{

background:white;

padding:20px 40px;

box-shadow:
0 2px 8px
rgba(0,0,0,.05);

display:flex;

justify-content:
space-between;

align-items:center;

}

.logo{

font-size:34px;
font-weight:700;

color:#1e3a8a;

}

.sub{

font-size:14px;
color:#6b7280;

}


/* ==========================
   MAIN
========================== */

.container{

padding:40px;

}


.section-title{

font-size:24px;
font-weight:600;

margin-bottom:30px;

}


/* ==========================
   MENU CARDS
========================== */

.menu{

width:320px;

padding:18px;

background:white;

border:none;

border-radius:16px;

margin-bottom:14px;

font-size:18px;

font-weight:600;

text-align:left;

cursor:pointer;

box-shadow:

0 4px 10px
rgba(0,0,0,.06);

transition:.25s;

}


.menu:hover{

transform:
translateY(-3px);

background:
#eef4ff;

}


/* ==========================
   FOLDERS
========================== */

.folder{

margin-left:35px;

padding:14px;

background:white;

border-radius:12px;

margin-bottom:8px;

width:260px;

box-shadow:

0 2px 8px
rgba(0,0,0,.05);

cursor:pointer;

transition:.2s;

}


.folder:hover{

background:#f0f7ff;

}


/* ==========================
   STATUS BAR
========================== */

.status{

margin-top:40px;

padding:20px;

background:white;

border-radius:16px;

box-shadow:

0 4px 10px
rgba(0,0,0,.05);

width:500px;

}


.small{

font-size:14px;
color:gray;

}

</style>

</head>



<body>


<div class="header">

<div>

<div class="logo">

WakeSuite

</div>

<div class="sub">

Marketplace Operations Portal

</div>

</div>

<div>

24 May 2026

</div>

</div>



<div class="container">

<div class="section-title">

Modules

</div>


<div id="content">

Loading...

</div>


<div class="status">

<b>System Status</b>

<br><br>

<div class="small">

Google Sheets : Connected

<br>

Apps Script : Active

<br>

GitHub : Live

</div>

</div>


</div>



<script>

async function loadData(){

try{

let response =
await fetch(
"https://script.googleusercontent.com/a/macros/wakefit.co/echo?user_content_key=AUkAhnRT-0CtWcRKPUpszyynziXN_mrbOeAYzbhzmHFCU6z5GRSnYPuBP-8pSVdUPyVYg9f8zTVxGLPoyTXGhpFIuFB8q9ah32hfINlu8RVCFAhqzFzDQ4dXcttX56LM_zd7t8KhZYm32Q9hISABQStmUTaziNifBqOh_wM1c05aA32QlyQuJIjBsPqa5vARKt66DHFZKmbcutmy13_Asuvs_KzGL-cxzXFT3Ji0QFQCuuxEAWBMOt5GDiHRHff7TrICbtsGUVCnHdnt0xTqcIwO4VtBGV-8AwYahoMKGjSe&lib=MosJG25q3a5Xj7Jm-JPRrUZxeXXwTpFvz"
);

let data =
await response.json();

let menus =
data.menus.slice(1);

let folders =
data.folders.slice(1);

let html="";


menus.forEach(menu=>{

if(menu[1]){

html +=

`

<button

class="menu"

onclick="toggle('${menu[0]}')">

${menu[0]}

</button>


<div

id="${menu[0]}"

style="display:none">

`;

folders.forEach(folder=>{

if(

folder[0]===menu[0]

&& folder[2]

){

html +=

`

<div class="folder">

📁 ${folder[1]}

</div>

`;

}

});


html +=
`</div>`;

}

});


document
.getElementById(
"content"
)
.innerHTML =
html;

}


catch(error){

document
.getElementById(
"content"
)
.innerHTML =

"Error loading";

console.log(error);

}

}


function toggle(id){

let x =
document.getElementById(id);

x.style.display =

x.style.display==="none"

?

"block"

:

"none";

}


loadData();

</script>


</body>
</html>
