<!DOCTYPE html>
<html>
<head>

<title>Price Disparity Dashboard</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
padding:30px;
background:#f8fafc;
}

h1{
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:
0 4px 12px rgba(0,0,0,.08);
}

.metric{
font-size:30px;
font-weight:700;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
table-layout:auto;
}

th{
background:#2563eb;
color:white;
padding:12px;
position:sticky;
top:0;
z-index:1;
white-space:nowrap;
}

td{
padding:10px;
border:1px solid #ddd;
white-space:nowrap;
}

th,td{
border:1px solid #ddd;
text-align:left;
}

tr:nth-child(even){
background:#f8fafc;
}

/* Date columns smaller */

th:nth-child(1),
td:nth-child(1),

th:nth-child(2),
td:nth-child(2),

th:nth-child(3),
td:nth-child(3){

font-size:12px;

}

/* Action column */

th:nth-child(14),
td:nth-child(14){

font-weight:bold;

}

/* Chart containers */

.chart-container{

width:100%;
max-width:1200px;

margin:30px auto;

background:white;

padding:20px;

border-radius:16px;

box-shadow:
0 4px 12px rgba(0,0,0,.08);

}

canvas{

max-height:350px !important;

}

/* Better filter alignment */

input,
select,
button{

vertical-align:middle;

}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1>
Price Disparity Dashboard
</h1>

<div class="cards">

<div class="card">
Total Disparities
<div class="metric" id="totalDisparities">0</div>
</div>

<div class="card">
Total Daily Impact
<div class="metric" id="totalImpact">₹0</div>
</div>

<div class="card">
Highest Impact
<div class="metric" id="highestImpact">₹0</div>
</div>

<div class="card">
Price Only
<div class="metric" id="priceOnly">0</div>
</div>

<div class="card">
Top Impact SKU
<div class="metric" id="topImpactSku">-</div>
</div>
  
</div>

<div style="margin-bottom:15px;">

<input
type="text"
id="searchBox"
placeholder="Search SKU / ASIN..."
onkeyup="filterTable()"
style="
width:40%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
">

<select
id="actionFilter"
onchange="filterTable()"
style="
padding:12px;
margin-left:10px;
border:1px solid #ddd;
border-radius:8px;
">

<option value="">
All Actions
</option>

<option value="Update Price">
Update Price
</option>

<option value="Update MRP">
Update MRP
</option>

<option value="Update Price + Update MRP">
Update Price + Update MRP
</option>

</select>
<select
id="categoryFilter"
onchange="filterTable()"
style="
padding:12px;
margin-bottom:15px;
margin-left:10px;
border:1px solid #ddd;
border-radius:8px;
">

<option value="">
All Categories
</option>

</select>
<input
type="date"
id="dateFilter"
onchange="filterTable()"
style="
padding:12px;
margin-bottom:15px;
margin-left:10px;
border:1px solid #ddd;
border-radius:8px;
">
<button
onclick="sortByImpact()"
style="
padding:12px;
margin-left:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
">
Sort by Impact ↓
</button>

<button
onclick="exportCSV()"
style="
padding:12px;
margin-left:10px;
border:none;
border-radius:8px;
background:green;
color:white;
cursor:pointer;
">
Export CSV
</button>
<button
onclick="toggleAnalytics()"
style="
padding:12px;
margin-left:10px;
border:none;
border-radius:8px;
background:#7c3aed;
color:white;
cursor:pointer;
">
📊 Show Analytics
</button>
</div>
<div
id="analyticsSection"
style="
display:none;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
margin-bottom:20px;
"
>

<h2>Daily Disparity Trend</h2>
<canvas id="dailyDisparityChart"></canvas>

<br><br>

<h2>Daily Impact Trend</h2>
<canvas id="dailyImpactChart"></canvas>

<br><br>

<h2>Disparities by Category</h2>
<canvas id="categoryChart"></canvas>

</div>

<br><br>

<table id="disparityTable">
<tr>
<td>Loading...</td>
</tr>
</table>
<script>

async function loadDisparity(){

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbwyR5zJ2lk8urzsPOWL6T8t29yjwbc83nlW6k0mkw5-H0oncL4oQmqF5LH1V_uNeBKT/exec"
);

let data =
await response.json();

let rows =
data.priceDisparity;

let categories =
new Set();

let dailyImpactMap = {};
let dailyDisparityMap = {};
let categoryCountMap = {};

let totalImpact = 0;
let highestImpact = 0;
let priceOnly = 0;

let topSku = "";
let topImpact = 3;
for(let i=1;i<rows.length;i++){

let impact =
Number(rows[i][14] || 0);
let reportDate =
rows[i][2];

if(!dailyImpactMap[reportDate]){

dailyImpactMap[reportDate] = 0;
dailyDisparityMap[reportDate] = 0;

}

dailyImpactMap[reportDate] += impact;
dailyDisparityMap[reportDate]++;

let category =
rows[i][6];

if(!categoryCountMap[category]){

categoryCountMap[category] = 0;

}

categoryCountMap[category]++;

totalImpact += impact;

if(impact > highestImpact){
highestImpact = impact;
}

if(impact > topImpact){

topImpact = impact;

topSku = rows[i][3];

}
let action =
String(rows[i][13] || "");

categories.add(
rows[i][6]
);

if(action === "Update Price"){
priceOnly++;
}

}

document.getElementById(
"totalDisparities"
).innerText =
rows.length - 1;

document.getElementById(
"totalImpact"
).innerText =
"₹" + totalImpact;

document.getElementById(
"highestImpact"
).innerText =
"₹" + highestImpact;

document.getElementById(
"priceOnly"
).innerText =
priceOnly;

document.getElementById(
"topImpactSku"
).innerText =
topSku;

let categoryHtml =
'<option value="">All Categories</option>';

categories.forEach(cat=>{

categoryHtml +=
`<option value="${cat}">
${cat}
</option>`;

});

document.getElementById(
"categoryFilter"
).innerHTML =
categoryHtml;

let html = "";

rows.forEach((row,index)=>{

html += "<tr>";

row.forEach((col,colIndex)=>{

if(index===0){

html +=
"<th>" +
col +
"</th>";

}

else{

if(colIndex===13){

let color="";

if(col==="Update Price"){

color="#f59e0b";

}

else if(col==="Update MRP"){

color="#2563eb";

}

else if(col==="Update Price + Update MRP"){

color="#ef4444";

}

html +=

`<td style="
font-weight:bold;
color:${color};
">

${col}

</td>`;

}

else{

if(colIndex===4){

html +=
`<td>
<a
href="https://www.amazon.in/dp/${col}"
target="_blank"
style="
color:#2563eb;
font-weight:bold;
text-decoration:none;
">
${col}
</a>
</td>`;

}

else{

html +=
"<td>" +
col +
"</td>";

}

}

}

});

html += "</tr>";

});

document
.getElementById(
"disparityTable"
)
.innerHTML =
html;
createCharts(
dailyImpactMap,
dailyDisparityMap,
categoryCountMap
);
}
function createCharts(

dailyImpactMap,
dailyDisparityMap,
categoryCountMap

){

new Chart(

document.getElementById(
"dailyImpactChart"
),

{
type:"line",

data:{

labels:
Object.keys(
dailyImpactMap
),

datasets:[{

label:
"Daily Impact",

data:
Object.values(
dailyImpactMap
)

}]

}

}

);

new Chart(

document.getElementById(
"dailyDisparityChart"
),

{
type:"line",

data:{

labels:
Object.keys(
dailyDisparityMap
),

datasets:[{

label:
"Daily Disparities",

data:
Object.values(
dailyDisparityMap
)

}]

}

}

);

new Chart(

document.getElementById(
"categoryChart"
),

{
type:"bar",

data:{

labels:
Object.keys(
categoryCountMap
),

datasets:[{

label:
"Disparities",

data:
Object.values(
categoryCountMap
)

}]

}

}

);

}
function filterTable(){

let searchText =
document.getElementById(
"searchBox"
).value.toUpperCase();

let actionFilter =
document.getElementById(
"actionFilter"
).value;

let categoryFilter =
document.getElementById(
"categoryFilter"
).value;

let dateFilter =
document.getElementById(
"dateFilter"
).value;

let table =
document.getElementById(
"disparityTable"
);

let rows =
table.getElementsByTagName(
"tr"
);

for(let i=1;i<rows.length;i++){

let text =
rows[i].textContent ||
rows[i].innerText;

let actionCell =
rows[i].cells[13]
?
rows[i].cells[13].innerText
:
"";

let categoryCell =
rows[i].cells[6]
?
rows[i].cells[6].innerText
:
"";

let dateCell =
rows[i].cells[2]
?
rows[i].cells[2].innerText
:
"";

let matchesSearch =
text.toUpperCase()
.indexOf(searchText)
> -1;

let matchesAction =

actionFilter === ""

||

actionCell ===
actionFilter;

let matchesCategory =

categoryFilter === ""

||

categoryCell ===
categoryFilter;

let matchesDate = true;

if(dateFilter !== ""){

let selectedDate =
new Date(dateFilter);

let formattedDate =
selectedDate.toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
).replace(/,/g,"");

matchesDate =
dateCell === formattedDate;

}

rows[i].style.display =

matchesSearch &&
matchesAction &&
matchesCategory &&
matchesDate

?

""

:

"none";

}

}

function sortByImpact(){

let table =
document.getElementById(
"disparityTable"
);

let rows =
Array.from(
table.rows
).slice(1);

rows.sort(
(a,b)=>

Number(
b.cells[14].innerText
)

-

Number(
a.cells[14].innerText
)

);

rows.forEach(
row =>
table.appendChild(row)
);

}

function exportCSV(){

let table =
document.getElementById(
"disparityTable"
);

let csv = [];

for(let row of table.rows){

let cols =
Array.from(row.cells)
.map(cell =>
'"' + cell.innerText + '"'
);

csv.push(cols.join(","));

}

let blob =
new Blob(
[csv.join("\n")],
{
type:"text/csv"
}
);

let a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"price_disparity.csv";

a.click();

}
function toggleAnalytics(){

let section =
document.getElementById(
"analyticsSection"
);

if(
section.style.display === "none"
){

section.style.display =
"block";

}
else{

section.style.display =
"none";

}

}
loadDisparity();

</script>
