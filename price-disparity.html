<!DOCTYPE html>
<html>
<head>

<title>Price Disparity Dashboard</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
padding:30px;
background:#f8fafc;
}

h1{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:left;
}

th{
background:#2563eb;
color:white;
}

</style>

</head>

<h1>
Price Disparity Dashboard
</h1>

<table id="disparityTable">
<tr>
<td>Loading...</td>
</tr>
</table>

<script>

async function loadDisparity(){

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec"
);

let data =
await response.json();

let rows =
data.priceDisparity;

let html = "";

rows.forEach((row,index)=>{

html += "<tr>";

row.forEach(col=>{

if(index===0){

html +=
"<th>" +
col +
"</th>";

}else{

html +=
"<td>" +
col +
"</td>";

}

});

html += "</tr>";

});

document
.getElementById(
"disparityTable"
)
.innerHTML =
html;

}

loadDisparity();

</script>
</html>
