<!DOCTYPE html>
<html>
<head>

<title>Price Disparity Dashboard</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<style>
.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:
0 4px 12px rgba(0,0,0,.08);
}

.metric{
font-size:30px;
font-weight:700;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#2563eb;
color:white;
padding:12px;
position:sticky;
top:0;
}

td{
padding:10px;
border:1px solid #ddd;
}

tr:nth-child(even){
background:#f8fafc;
}
body{
font-family:Arial;
padding:30px;
background:#f8fafc;
}

h1{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:left;
}

th{
background:#2563eb;
color:white;
}

</style>

</head>

<body>

<h1>
Price Disparity Dashboard
</h1>

<div class="cards">

<div class="card">
Total Disparities
<div class="metric" id="totalDisparities">0</div>
</div>

<div class="card">
Total Daily Impact
<div class="metric" id="totalImpact">₹0</div>
</div>

<div class="card">
Highest Impact
<div class="metric" id="highestImpact">₹0</div>
</div>

<div class="card">
Price Only
<div class="metric" id="priceOnly">0</div>
</div>

</div>

<input
type="text"
id="searchBox"
placeholder="Search SKU / ASIN..."
onkeyup="filterTable()"
style="
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
">
<select
id="actionFilter"
onchange="filterTable()"
style="
padding:12px;
margin-bottom:15px;
margin-left:10px;
border:1px solid #ddd;
border-radius:8px;
">

<option value="">
All Actions
</option>

<option value="Update Price">
Update Price
</option>

<option value="Update MRP">
Update MRP
</option>

<option value="Update Price + Update MRP">
Update Price + Update MRP
</option>

</select>
<table id="disparityTable">
<tr>
<td>Loading...</td>
</tr>
</table>
<script>

async function loadDisparity(){

let response =
await fetch(
"https://script.google.com/macros/s/AKfycbwATBjVbhBakrmycVfde-bQCEjaXWMc4YRNz3c_PTcEbOWZ5fE69fmyIWmAKPF71D5n/exec"
);

let data =
await response.json();

let rows =
data.priceDisparity;
let totalImpact = 0;
let highestImpact = 0;
let priceOnly = 0;

for(let i=1;i<rows.length;i++){

let impact =
Number(rows[i][13] || 0);

totalImpact += impact;

if(
impact > highestImpact
){
highestImpact = impact;
}

let action =
String(rows[i][12] || "");

if(
action ===
"Update Price"
){
priceOnly++;
}

}

document.getElementById(
"totalDisparities"
).innerText =
rows.length - 1;

document.getElementById(
"totalImpact"
).innerText =
"₹" + totalImpact;

document.getElementById(
"highestImpact"
).innerText =
"₹" + highestImpact;

document.getElementById(
"priceOnly"
).innerText =
priceOnly;
let html = "";

rows.forEach((row,index)=>{

html += "<tr>";

row.forEach(col=>{

if(index===0){

html +=
"<th>" +
col +
"</th>";

}else{

html +=
"<td>" +
col +
"</td>";

}

});

html += "</tr>";

});

document
.getElementById(
"disparityTable"
)
.innerHTML =
html;
<button
onclick="sortByImpact()"
style="
padding:12px;
margin-left:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
">

Sort by Impact ↓

</button>
}
function filterTable(){

let searchText =
document.getElementById(
"searchBox"
).value.toUpperCase();

let actionFilter =
document.getElementById(
"actionFilter"
).value;

let table =
document.getElementById(
"disparityTable"
);

let rows =
table.getElementsByTagName(
"tr"
);

for(
let i=1;
i<rows.length;
i++
){

let text =
rows[i].textContent ||
rows[i].innerText;

let actionCell =
rows[i].cells[12]
?
rows[i].cells[12].innerText
:
"";

let matchesSearch =
text.toUpperCase()
.indexOf(searchText)
> -1;

let matchesAction =

actionFilter === ""

||

actionCell ===
actionFilter;

rows[i].style.display =

matchesSearch &&
matchesAction

?

""

:

"none";

}
function sortByImpact(){

let table =
document.getElementById(
"disparityTable"
);

let rows =
Array.from(
table.rows
).slice(1);

rows.sort(
(a,b)=>

Number(
b.cells[13].innerText
)

-

Number(
a.cells[13].innerText
)

);

rows.forEach(
row =>
table.appendChild(row)
);

}
<button
onclick="exportCSV()"
style="
padding:12px;
margin-left:10px;
border:none;
border-radius:8px;
background:green;
color:white;
cursor:pointer;
">

Export CSV

</button>
function exportCSV(){

let table =
document.getElementById(
"disparityTable"
);

let csv = [];

for(
let row of table.rows
){

let cols =
Array.from(
row.cells
).map(
cell =>
'"' +
cell.innerText +
'"'
);

csv.push(
cols.join(",")
);

}

let blob =
new Blob(
[csv.join("\n")],
{
type:"text/csv"
}
);

let a =
document.createElement(
"a"
);

a.href =
URL.createObjectURL(
blob
);

a.download =
"price_disparity.csv";

a.click();

}
}
loadDisparity();

</script>
</html>
